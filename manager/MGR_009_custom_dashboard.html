    <script>
        // Dashboard builder functionality
        const canvas = document.getElementById('dashboard-canvas');
        const sampleWidgets = document.getElementById('sample-widgets');
        let isDragging = false;

        // Drag and drop functionality
        document.querySelectorAll('[data-widget]').forEach(widget => {
            widget.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.dataset.widget);
                isDragging = true;
            });
        });

        canvas.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (isDragging) {
                canvas.classList.add('border-primary', 'bg-primary/5');
                canvas.classList.remove('border-gray-border', 'bg-gray-50');
            }
        });

        canvas.addEventListener('dragleave', (e) => {
            canvas.classList.remove('border-primary', 'bg-primary/5');
            canvas.classList.add('border-gray-border', 'bg-gray-50');
        });

        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const widgetType = e.dataTransfer.getData('text/plain');
            canvas.classList.remove('border-primary', 'bg-primary/5');
            canvas.classList.add('border-gray-border', 'bg-gray-50');
            
            // Show sample widgets
            sampleWidgets.classList.remove('hidden');
            canvas.querySelector('.text-center').style.display = 'none';
            isDragging = false;
        });

        // Layout selection
        document.querySelectorAll('.layout-option').forEach(option => {
            option.addEventListener('click', (e) => {
                // Remove active class from all options
                document.querySelectorAll('.layout-option').forEach(opt => {
                    opt.classList.remove('border-primary', 'bg-primary/5');
                    opt.classList.add('border-gray-border');
                    opt.querySelector('div:last-child').classList.remove('text-primary', 'font-medium');
                    opt.querySelector('div:last-child').classList.add('text-gray-medium');
                });
                
                // Add active class to clicked option
                e.currentTarget.classList.add('border-primary', 'bg-primary/5');
                e.currentTarget.classList.remove('border-gray-border');
                e.currentTarget.querySelector('div:last-child').classList.add('text-primary', 'font-medium');
                e.currentTarget.querySelector('div:last-child').classList.remove('text-gray-medium');
            });
        });
    </script>
</body>
</html>
