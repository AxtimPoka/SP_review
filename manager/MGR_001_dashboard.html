    <!-- 引入Modal組件 -->
    <div id="modalContainer"></div>
    <script>
      // 動態載入Modal組件
      fetch("../includes/modals-all.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("modalContainer").innerHTML = html;

          // 初始化頁面功能
          initializeDashboard();
        })
        .catch((error) => {
          console.error("Error loading modals:", error);
        });

      function initializeDashboard() {
        // 模擬數據載入
        showLoading("正在載入儀表板數據...");

        // 模擬載入完成
        setTimeout(() => {
          hideLoading();

          // 可選：顯示載入完成提示

          //     message: '儀表板數據已成功載入',
          //     onConfirm: () => console.log('用戶已確認')

        }, 1500);
