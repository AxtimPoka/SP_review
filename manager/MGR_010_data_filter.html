<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據篩選 - SalesAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'gray-dark': '#1A1A1A',
                        'gray-medium': '#666666',
                        'gray-light': '#999999',
                        'gray-bg': '#F8F9FA',
                        'gray-border': '#E5E5E5'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-bg h-full">
    <div class="min-h-full pb-20">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-border">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <button onclick="history.back()" class="p-2 text-gray-medium hover:text-gray-dark transition-colors mr-2">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                            </svg>
                        </button>
                        <h1 class="text-xl font-bold text-gray-dark">數據篩選</h1>
                    </div>
                    <div class="flex space-x-2">
                        <button class="px-4 py-2 text-gray-medium border border-gray-border rounded-lg hover:bg-gray-50 transition-colors">
                            清除全部
                        </button>
                        <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
                            套用篩選
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Quick Filters -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border mb-6">
                <h2 class="text-lg font-bold text-gray-dark mb-4">快速篩選</h2>
                <div class="flex flex-wrap gap-3">
                    <button class="px-4 py-2 bg-primary text-white rounded-full text-sm hover:bg-primary/90 transition-colors">
                        本週高績效
                    </button>
                    <button class="px-4 py-2 border border-gray-border text-gray-medium rounded-full text-sm hover:bg-gray-50 transition-colors">
                        需要關注
                    </button>
                    <button class="px-4 py-2 border border-gray-border text-gray-medium rounded-full text-sm hover:bg-gray-50 transition-colors">
                        新進成員
                    </button>
                    <button class="px-4 py-2 border border-gray-border text-gray-medium rounded-full text-sm hover:bg-gray-50 transition-colors">
                        評分上升
                    </button>
                    <button class="px-4 py-2 border border-gray-border text-gray-medium rounded-full text-sm hover:bg-gray-50 transition-colors">
                        成交活躍
                    </button>
                </div>
            </div>

            <!-- Advanced Filters -->
            <div class="space-y-6">
                <!-- Time Range Filter -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border">
                    <h3 class="text-lg font-semibold text-gray-dark mb-4">時間範圍</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">開始日期</label>
                            <input type="date" class="w-full px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">結束日期</label>
                            <input type="date" class="w-full px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">預設區間</label>
                            <select class="w-full px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option>自定義</option>
                                <option>今天</option>
                                <option>本週</option>
                                <option>本月</option>
                                <option>本季</option>
                                <option>今年</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">時段</label>
                            <select class="w-full px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option>全天</option>
                                <option>上午 (9:00-12:00)</option>
                                <option>下午 (13:00-17:00)</option>
                                <option>晚上 (18:00-21:00)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Team & Member Filter -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border">
                    <h3 class="text-lg font-semibold text-gray-dark mb-4">團隊與成員</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-3">選擇團隊</label>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" checked class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">團隊A - 壽險專組</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">團隊B - 產險專組</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">團隊C - 綜合業務組</span>
                                </label>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-3">職位</label>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" checked class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">銷售專員</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" checked class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">資深銷售</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">銷售主管</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">特定成員</label>
                            <div class="relative">
                                <input type="text" placeholder="搜尋成員..." class="w-full pl-10 pr-4 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                            <div class="mt-2 space-y-1 max-h-32 overflow-y-auto">
                                <div class="text-xs text-gray-medium p-2">選擇特定成員進行篩選</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Performance Filter -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border">
                    <h3 class="text-lg font-semibold text-gray-dark mb-4">績效篩選</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">整體評分範圍</label>
                            <div class="space-y-3">
                                <div class="flex items-center space-x-4">
                                    <input type="range" min="0" max="10" step="0.1" value="0" class="flex-1" id="scoreMin">
                                    <span class="text-sm text-gray-medium w-8" id="scoreMinValue">0</span>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <input type="range" min="0" max="10" step="0.1" value="10" class="flex-1" id="scoreMax">
                                    <span class="text-sm text-gray-medium w-8" id="scoreMaxValue">10</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">成交數量</label>
                            <div class="space-y-2">
                                <div class="flex space-x-2">
                                    <input type="number" placeholder="最少" min="0" class="flex-1 px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                    <input type="number" placeholder="最多" min="0" class="flex-1 px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-2">錄音數量</label>
                            <div class="space-y-2">
                                <div class="flex space-x-2">
                                    <input type="number" placeholder="最少" min="0" class="flex-1 px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                    <input type="number" placeholder="最多" min="0" class="flex-1 px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dimension Filter -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border">
                    <h3 class="text-lg font-semibold text-gray-dark mb-4">三大維度篩選</h3>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Process Adherence -->
                        <div class="p-4 bg-success/5 border border-success/20 rounded-lg">
                            <h4 class="font-semibold text-gray-dark mb-3 flex items-center">
                                <div class="w-6 h-6 bg-success/10 rounded-full flex items-center justify-center mr-2">
                                    <div class="w-3 h-3 bg-success rounded-full"></div>
                                </div>
                                流程遵守度
                            </h4>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-success border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">優秀 (90%+)</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-success border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">良好 (80-89%)</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-success border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">待改善 (<80%)</span>
                                </label>
                            </div>
                        </div>

                        <!-- Sales Skills -->
                        <div class="p-4 bg-primary/5 border border-primary/20 rounded-lg">
                            <h4 class="font-semibold text-gray-dark mb-3 flex items-center">
                                <div class="w-6 h-6 bg-primary/10 rounded-full flex items-center justify-center mr-2">
                                    <div class="w-3 h-3 bg-primary rounded-full"></div>
                                </div>
                                銷售技巧
                            </h4>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">優秀 (9.0+)</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">良好 (7.0-8.9)</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">待改善 (<7.0)</span>
                                </label>
                            </div>
                        </div>

                        <!-- Communication -->
                        <div class="p-4 bg-warning/5 border border-warning/20 rounded-lg">
                            <h4 class="font-semibold text-gray-dark mb-3 flex items-center">
                                <div class="w-6 h-6 bg-warning/10 rounded-full flex items-center justify-center mr-2">
                                    <div class="w-3 h-3 bg-warning rounded-full"></div>
                                </div>
                                溝通能力
                            </h4>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-warning border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">優秀 (9.0+)</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-warning border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">良好 (7.0-8.9)</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-warning border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">待改善 (<7.0)</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Activity Filter -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border">
                    <h3 class="text-lg font-semibold text-gray-dark mb-4">活動狀態</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-3">活躍狀態</label>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="radio" name="activity" value="all" checked class="w-4 h-4 text-primary">
                                    <span class="ml-2 text-sm text-gray-dark">全部</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="activity" value="active" class="w-4 h-4 text-primary">
                                    <span class="ml-2 text-sm text-gray-dark">活躍</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="activity" value="inactive" class="w-4 h-4 text-primary">
                                    <span class="ml-2 text-sm text-gray-dark">不活躍</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-3">最後錄音</label>
                            <select class="w-full px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option>不限</option>
                                <option>今天</option>
                                <option>3天內</option>
                                <option>1週內</option>
                                <option>1個月內</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-3">最後成交</label>
                            <select class="w-full px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                                <option>不限</option>
                                <option>今天</option>
                                <option>3天內</option>
                                <option>1週內</option>
                                <option>1個月內</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-dark mb-3">趨勢</label>
                            <div class="space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">評分上升</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" class="w-4 h-4 text-primary border-gray-border rounded">
                                    <span class="ml-2 text-sm text-gray-dark">評分下降</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Save Filter -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-border mt-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-gray-dark">儲存篩選條件</h3>
                        <p class="text-sm text-gray-medium">儲存常用的篩選組合以便快速使用</p>
                    </div>
                    <div class="flex space-x-3">
                        <input type="text" placeholder="篩選名稱..." class="px-3 py-2 border border-gray-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        <button class="px-4 py-2 bg-secondary text-white rounded-lg hover:bg-secondary/90 transition-colors">
                            儲存
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Score range sliders
        const scoreMin = document.getElementById('scoreMin');
        const scoreMax = document.getElementById('scoreMax');
        const scoreMinValue = document.getElementById('scoreMinValue');
        const scoreMaxValue = document.getElementById('scoreMaxValue');

        scoreMin.addEventListener('input', function() {
            scoreMinValue.textContent = this.value;
        });

        scoreMax.addEventListener('input', function() {
            scoreMaxValue.textContent = this.value;
        });

        // Quick filter buttons
        document.querySelectorAll('button[class*="px-4 py-2"]').forEach(button => {
            if (button.textContent.includes('本週高績效') || 
                button.textContent.includes('需要關注') || 
                button.textContent.includes('新進成員') ||
                button.textContent.includes('評分上升') ||
                button.textContent.includes('成交活躍')) {
                button.addEventListener('click', function() {
                    // Toggle button state
                    if (this.classList.contains('bg-primary')) {
                        this.classList.remove('bg-primary', 'text-white');
                        this.classList.add('border', 'border-gray-border', 'text-gray-medium');
                    } else {
                        this.classList.add('bg-primary', 'text-white');
                        this.classList.remove('border', 'border-gray-border', 'text-gray-medium');
                    }
                });
            }
        });
    </script>
</body>
</html>
