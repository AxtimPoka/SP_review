    <!-- 引入Modal組件 -->
    <div id="modalContainer"></div>
    <script>
        // 動態載入Modal組件
        fetch('../includes/modals-all.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('modalContainer').innerHTML = html;
                
                // 初始化頁面功能
                initializeTeamList();
            })
            .catch(error => {
                console.error('Error loading modals:', error);
            });
        
        function initializeTeamList() {
            // 為成員卡片添加長按事件
            document.querySelectorAll('.member-card').forEach(card => {
                let pressTimer;
                
                // 長按開始
                card.addEventListener('mousedown', function() {
                    pressTimer = setTimeout(() => {
                        showMemberActions(card);
                    }, 500); // 500ms長按
                });
                
                card.addEventListener('touchstart', function() {
                    pressTimer = setTimeout(() => {
                        showMemberActions(card);
                    }, 500);
                });
                
                // 長按結束
                card.addEventListener('mouseup', () => clearTimeout(pressTimer));
                card.addEventListener('touchend', () => clearTimeout(pressTimer));
                card.addEventListener('mouseleave', () => clearTimeout(pressTimer));
            });
        }
        
        // 顯示成員操作選單
        function showMemberActions(card) {
            const memberName = card.querySelector('h3')?.textContent || '成員';
            
            showActionSheet({
                title: memberName,
                actions: [
                    {
                        text: '查看詳情',
                        handler: () => {
                            window.location.href = 'MGR_004_member_detail.html';
                        }
                    },
                    {
                        text: '編輯資料',
                        handler: () => {
                            console.log('編輯成員資料');
                        }
                    },
                    {
                        text: '發送訊息',
                        handler: () => {
                            console.log('發送訊息給成員');
                        }
                    },
                    {
                        text: '刪除成員',
                        destructive: true,
                        handler: () => {
                            confirmDeleteMember(memberName);
                        }
                    }
                ]
            });
        }
        
        // 確認刪除成員
        function confirmDeleteMember(memberName) {
            showConfirm({
                title: '刪除成員',
                message: `確定要刪除「${memberName}」嗎？此操作無法復原。`,
                onConfirm: () => {
                    showLoading('正在刪除...');
                    setTimeout(() => {
                        hideLoading();
                        showWarning({
                            title: '刪除成功',
                            message: `${memberName} 已從團隊中移除`,
                            onConfirm: () => {
                                location.reload(); // 重新載入頁面
                            }
                        });
                    }, 1000);
                }
            });
        }
        
        // 添加成員類別以便識別
        document.addEventListener('DOMContentLoaded', function() {
            // 為所有成員卡片添加類別
            const memberCards = document.querySelectorAll('.bg-white.rounded-xl.p-6');
            memberCards.forEach((card, index) => {
                if (index > 0 && index < memberCards.length - 1) { // 排除統計卡片
                    card.classList.add('member-card');
                }
            });
        });
    </script>
