    <script>
      // Toggle visit records function
      function toggleRecords(recordsId) {
        const records = document.getElementById(recordsId);
        const toggleText = document.getElementById(
          recordsId.replace("-records", "-toggle-text")
        );

        if (records.style.display === "none" || records.style.display === "") {
          records.style.display = "block";
          toggleText.textContent = "收合拜訪紀錄";
        } else {
          records.style.display = "none";
          toggleText.textContent = "展開 2 筆拜訪紀錄";
        }
      }
