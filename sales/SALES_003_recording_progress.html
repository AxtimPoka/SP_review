<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesAI - 錄音中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#2E5BFF',
                        'secondary': '#00C6AE',
                        'success': '#00D563',
                        'warning': '#FFB800',
                        'error': '#FF4757',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#666666',
                        'text-tertiary': '#999999'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% {
                transform: scale(0.33);
                opacity: 1;
            }
            80%, 100% {
                transform: scale(2.33);
                opacity: 0;
            }
        }
        .pulse-dot {
            animation: pulse-dot 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) -0.4s infinite;
        }
        @keyframes pulse-dot {
            0% {
                transform: scale(0.8);
            }
            50% {
                transform: scale(1);
            }
            100% {
                transform: scale(0.8);
            }
        }
        .wave-bar {
            width: 6px;
            height: 30px;
            background: linear-gradient(to top, #FF4757, #FF6B7A);
            margin: 0 3px;
            border-radius: 3px;
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
        }
        .wave-bar:nth-child(1) { animation-delay: 0s; height: 20px; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 35px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 25px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 40px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 30px; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; height: 35px; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; height: 25px; }
        .wave-bar:nth-child(8) { animation-delay: 0.7s; height: 30px; }
        
        @keyframes wave {
            0%, 100% { transform: scaleY(0.3); opacity: 0.7; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        
        .volume-meter {
            height: 8px;
            background: linear-gradient(to right, #00D563, #FFB800, #FF4757);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .volume-indicator {
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body class="bg-gray-900 font-sans text-white">
    <!-- Header -->
    <header class="bg-gray-800 px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-2 h-2 bg-error rounded-full pulse-dot"></div>
                <span class="text-sm text-red-400">錄音中</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative cursor-pointer" onclick="location.href='../common/COMMON_008_notification_center.html'">
                    <i class="fas fa-bell text-gray-400 text-lg"></i>
                    <span class="absolute -top-2 -right-2 bg-error text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">2</span>
                </div>
                <button onclick="location.href='../common/COMMON_001_settings.html'" class="text-gray-400">
                    <i class="fas fa-cog text-lg"></i>
                </button>
                <button onclick="pauseRecording()" class="text-yellow-400 bg-yellow-400/20 px-3 py-1 rounded-full text-sm">
                    <i class="fas fa-pause mr-1"></i>暫停
                </button>
                <button onclick="stopRecording()" class="text-red-400 bg-red-400/20 px-3 py-1 rounded-full text-sm">
                    <i class="fas fa-stop mr-1"></i>停止
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-4 py-8 min-h-screen flex flex-col items-center justify-center">
        <!-- Recording Indicator -->
        <div class="relative mb-8">
            <!-- Pulse Rings -->
            <div class="absolute inset-0 w-48 h-48 rounded-full bg-error/20 pulse-ring"></div>
            <div class="absolute inset-4 w-40 h-40 rounded-full bg-error/30 pulse-ring" style="animation-delay: 0.5s;"></div>
            
            <!-- Central Recording Button -->
            <div class="relative w-48 h-48 bg-error rounded-full flex flex-col items-center justify-center shadow-2xl">
                <i class="fas fa-microphone text-6xl text-white mb-2"></i>
                <div class="text-white text-center">
                    <div id="timer" class="text-3xl font-mono font-bold">00:00</div>
                    <div class="text-sm opacity-80">正在錄音</div>
                </div>
            </div>
        </div>

        <!-- Audio Waveform -->
        <div class="mb-8">
            <div class="flex justify-center items-end">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <!-- Volume Monitor -->
        <div class="w-full max-w-md mb-8">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm text-gray-400">音量監測</span>
                <span class="text-sm text-gray-400" id="volumePercent">65%</span>
            </div>
            <div class="volume-meter">
                <div class="volume-indicator" id="volumeBar" style="width: 65%"></div>
            </div>
        </div>

        <!-- Current Case Info -->
        <div class="bg-gray-800 rounded-xl p-4 w-full max-w-md mb-6">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm text-gray-400">關聯CASE</span>
                <button onclick="changeCase()" class="text-primary text-sm">更換</button>
            </div>
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-primary/20 rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-primary"></i>
                </div>
                <div>
                    <p class="font-medium">張先生</p>
                    <p class="text-sm text-gray-400">壽險規劃</p>
                </div>
            </div>
        </div>

        <!-- Recording Stats -->
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
            <div class="bg-gray-800 rounded-lg p-3 text-center">
                <div class="text-2xl font-bold text-primary" id="fileSize">2.1</div>
                <div class="text-xs text-gray-400">MB</div>
            </div>
            <div class="bg-gray-800 rounded-lg p-3 text-center">
                <div class="text-2xl font-bold text-secondary" id="quality">HD</div>
                <div class="text-xs text-gray-400">音質</div>
            </div>
        </div>

        <!-- Warning Messages -->
        <div class="mt-8 text-center max-w-md">
            <div class="bg-yellow-500/20 border border-yellow-500/30 rounded-lg p-3 mb-3">
                <div class="flex items-center justify-center text-yellow-400 text-sm">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    請保持手機穩定，避免移動造成雜音
                </div>
            </div>
            <div id="lowStorageWarning" class="hidden bg-red-500/20 border border-red-500/30 rounded-lg p-3">
                <div class="flex items-center justify-center text-red-400 text-sm">
                    <i class="fas fa-hdd mr-2"></i>
                    儲存空間不足，建議清理空間後繼續
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Actions -->
    <div class="fixed bottom-4 left-4 right-4">
        <div class="bg-gray-800 rounded-xl p-4">
            <div class="flex items-center justify-between">
                <button onclick="addMarker()" class="flex flex-col items-center text-gray-400">
                    <i class="fas fa-bookmark text-lg mb-1"></i>
                    <span class="text-xs">標記</span>
                </button>
                <button onclick="showNotes()" class="flex flex-col items-center text-gray-400">
                    <i class="fas fa-sticky-note text-lg mb-1"></i>
                    <span class="text-xs">筆記</span>
                </button>
                <button onclick="pauseRecording()" class="flex flex-col items-center text-yellow-400">
                    <i class="fas fa-pause text-lg mb-1"></i>
                    <span class="text-xs">暫停</span>
                </button>
                <button onclick="stopRecording()" class="flex flex-col items-center text-red-400">
                    <i class="fas fa-stop text-lg mb-1"></i>
                    <span class="text-xs">結束</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let startTime = Date.now();
        let timerInterval;
        let isPaused = false;
        let pausedDuration = 0;
        let pauseStartTime = 0;

        function startTimer() {
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (!isPaused) {
                const elapsed = Math.floor((Date.now() - startTime - pausedDuration) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${minutes}:${seconds}`;
                
                // Update file size simulation
                const fileSize = (elapsed * 0.075).toFixed(1); // Approximate MB
                document.getElementById('fileSize').textContent = fileSize;
            }
        }

        function pauseRecording() {
            if (!isPaused) {
                isPaused = true;
                pauseStartTime = Date.now();
                
                // Update UI
                document.querySelector('header .text-red-400').textContent = '已暫停';
                document.querySelector('.pulse-dot').style.animationPlayState = 'paused';
                document.querySelectorAll('.wave-bar').forEach(bar => {
                    bar.style.animationPlayState = 'paused';
                });
                
                // Change pause button to resume
                const pauseBtn = document.querySelector('[onclick="pauseRecording()"]');
                pauseBtn.innerHTML = '<i class="fas fa-play mr-1"></i>繼續';
                pauseBtn.onclick = resumeRecording;
                
                showToast('錄音已暫停', 'warning');
            }
        }

        function resumeRecording() {
            isPaused = false;
            pausedDuration += Date.now() - pauseStartTime;
            
            // Update UI
            document.querySelector('header .text-red-400').textContent = '錄音中';
            document.querySelector('.pulse-dot').style.animationPlayState = 'running';
            document.querySelectorAll('.wave-bar').forEach(bar => {
                bar.style.animationPlayState = 'running';
            });
            
            // Change resume button back to pause
            const resumeBtn = document.querySelector('[onclick="resumeRecording()"]');
            resumeBtn.innerHTML = '<i class="fas fa-pause mr-1"></i>暫停';
            resumeBtn.onclick = pauseRecording;
            
            showToast('錄音已恢復', 'success');
        }

        function stopRecording() {
            if (confirm('確定要結束錄音嗎？')) {
                clearInterval(timerInterval);
                location.href = 'SALES_004_recording_process.html';
            }
        }

        function changeCase() {
            // Show case selection modal
            showCaseSelection();
        }

        function addMarker() {
            const currentTime = document.getElementById('timer').textContent;
            showToast(`已在 ${currentTime} 添加標記`, 'success');
        }

        function showNotes() {
            // Show notes modal
            alert('筆記功能開發中...');
        }

        function showCaseSelection() {
            const cases = [
                '張先生 - 壽險規劃',
                '李太太 - 醫療險',
                '陳小姐 - 儲蓄險',
                '建立新CASE'
            ];
            
            const selection = prompt('選擇要關聯的CASE:\n' + cases.map((c, i) => `${i+1}. ${c}`).join('\n'));
            if (selection && parseInt(selection) <= cases.length) {
                showToast(`已切換至: ${cases[parseInt(selection)-1]}`, 'success');
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-4 right-4 p-3 rounded-lg text-white text-sm z-50 ${
                type === 'success' ? 'bg-success' : 
                type === 'warning' ? 'bg-warning' : 'bg-error'
            }`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Simulate volume monitoring
        function simulateVolumeMonitoring() {
            setInterval(() => {
                if (!isPaused) {
                    const volume = Math.random() * 100;
                    document.getElementById('volumeBar').style.width = volume + '%';
                    document.getElementById('volumePercent').textContent = Math.round(volume) + '%';
                }
            }, 200);
        }

        // Check storage space
        function checkStorageSpace() {
            // Simulate storage check
            if (Math.random() > 0.8) {
                document.getElementById('lowStorageWarning').classList.remove('hidden');
            }
        }

        // Prevent screen lock
        function preventScreenLock() {
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen');
            }
        }

        // Initialize
        window.onload = function() {
            startTimer();
            simulateVolumeMonitoring();
            checkStorageSpace();
            preventScreenLock();
        };

        // Handle app going to background
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // App went to background, show notification
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification('SalesAI 正在背景錄音中', {
                        body: '點擊返回應用程式',
                        icon: '/favicon.ico'
                    });
                }
            }
        });
    </script>
</body>
</html>
