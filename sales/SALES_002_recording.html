<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesAI - 錄音功能</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#2E5BFF',
                        'secondary': '#00C6AE',
                        'success': '#00D563',
                        'warning': '#FFB800',
                        'error': '#FF4757',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#666666',
                        'text-tertiary': '#999999'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .pulse-animation {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .recording-button {
            transition: all 0.3s ease;
        }
        .recording-button:hover {
            transform: scale(1.05);
        }
        .wave-bar {
            width: 4px;
            height: 20px;
            background: linear-gradient(to top, #2E5BFF, #00C6AE);
            margin: 0 2px;
            border-radius: 2px;
            display: inline-block;
            animation: wave 1.2s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.5); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <button onclick="history.back()" class="text-text-secondary">
                <i class="fas fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-semibold text-text-primary">錄音管理</h1>
            <div class="flex items-center space-x-4">
                <div class="relative cursor-pointer" onclick="location.href='../common/COMMON_008_notification_center.html'">
                    <i class="fas fa-bell text-text-secondary text-lg"></i>
                    <span class="absolute -top-2 -right-2 bg-error text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">2</span>
                </div>
                <button class="text-text-secondary cursor-pointer" onclick="location.href='../common/COMMON_001_settings.html'">
                    <i class="fas fa-cog text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-4 py-6 pb-24">

        <!-- Quick Filters -->
        <section class="mb-6">
            <div class="space-y-3">
                <!-- 時間篩選 -->
                <div class="flex items-center space-x-2">
                    <!-- <span class="text-sm text-text-secondary mr-2">時間：</span> -->
                    <div class="flex space-x-2 overflow-x-auto">
                        <button class="time-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="all" onclick="filterByTime('all')">全部</button>
                        <button class="time-filter bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="today" onclick="filterByTime('today')">今天</button>
                        <button class="time-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="week" onclick="filterByTime('week')">本週</button>
                    </div>
                </div>
                <!-- 狀態篩選 -->
                <div class="flex items-center space-x-2">
                    <!-- <span class="text-sm text-text-secondary mr-2">狀態：</span> -->
                    <div class="flex space-x-2 overflow-x-auto">
                        <button class="status-filter bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="all" onclick="filterByStatus('all')">全部</button>
                        <button class="status-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="analyzed" onclick="filterByStatus('analyzed')">已分析</button>
                        <button class="status-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="processing" onclick="filterByStatus('processing')">處理中</button>
                        <button class="status-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap" data-filter="failed" onclick="filterByStatus('failed')">處理失敗</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Recording History -->

            <!-- Recording List -->
            <div class="space-y-3" id="recordingsList">
                <!-- Recording Item 1 - 處理中 -->

                    <div class="flex items-center justify-between mb-2">

                                <h3 class="font-medium text-text-primary">張先生_壽險_0814</h3>

                            </div>
                        </div>

                            <span class="text-xs bg-warning/10 text-warning px-2 py-1 rounded-full">處理中</span>
                        </div>

                    <div class="flex items-center justify-between">

                    </div>

                            <div class="w-8 h-8 bg-success/10 rounded-full flex items-center justify-center">
                                <i class="fas fa-check-double text-success text-xs"></i>
                            </div>
                            <div>
                                <h3 class="font-medium text-text-primary">李太太_醫療險_0813</h3>
                                <p class="text-xs text-text-tertiary">22:18 | 昨天 10:15</p>
                            </div>
                        </div>
                        <div class="text-right">

                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 text-xs text-text-tertiary">
                            <i class="fas fa-folder"></i>
                            <span>李太太 / 醫療險</span>
                        </div>
                        <button class="bg-primary text-white px-3 py-1 rounded text-xs" onclick="location.href='SALES_011_ai_analysis.html?recording=李太太_醫療險_0813'">查看分析</button>

                    </div>
                    <div class="flex items-center justify-between">

                            <i class="fas fa-question-circle"></i>
                            <span>需要歸檔至客戶CASE</span>
                        </div>
                        <button class="bg-warning text-white px-3 py-1 rounded text-xs" onclick="location.href='SALES_004_recording_process.html?recording=未分類錄音_0812'">立即分類</button>
                    </div>
                </div>

                <!-- Recording Item 4 - 處理失敗 -->
                <div class="recording-item bg-white rounded-lg p-4 shadow-sm border-l-4 border-error" data-time="week" data-status="failed">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-error/10 rounded-full flex items-center justify-center">

                                <p class="text-xs text-text-tertiary">18:45 | 3天前 09:20</p>

                    </div>
                </div>

                <!-- Recording Item 5 - 今天處理中 -->
                <div class="recording-item bg-white rounded-lg p-4 shadow-sm" data-time="today" data-status="processing">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-warning/10 rounded-full flex items-center justify-center">
                                <i class="fas fa-spinner fa-spin text-warning text-xs"></i>
                            </div>
                            <div>
                                <h3 class="font-medium text-text-primary">陳小姐_投資型保單_0814</h3>
                                <p class="text-xs text-text-tertiary">35:20 | 今天 10:45</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs bg-warning/10 text-warning px-2 py-1 rounded-full">處理中</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2 text-xs text-text-tertiary">
                            <i class="fas fa-folder"></i>
                            <span>陳小姐 / 投資型保單</span>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Load More -->
            <button class="w-full mt-4 py-3 text-primary font-medium" onclick="loadMoreRecordings()">
                載入更多錄音...
            </button>
        </section>
    </main>

      <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="grid grid-cols-3 py-2">

                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-xs">首頁</span>
            </button>

                <i class="fas fa-trophy text-lg mb-1"></i>

            </button> -->
            <button class="flex flex-col items-center py-2 text-text-tertiary" onclick="location.href='SALES_003_recording_progress.html'">
                <i class="fas fa-microphone text-lg mb-1"></i>

            <!-- <button class="flex flex-col items-center py-2 text-text-tertiary" onclick="location.href='SALES_017_ask_ai.html'">
                <i class="fas fa-robot text-lg mb-1"></i>
                <span class="text-xs">Ask AI</span>
            </button> -->
            <button class="flex flex-col items-center py-2 text-text-tertiary" onclick="location.href='../common/COMMON_008_notification_center.html'">
                <i class="fas fa-bell text-lg mb-1"></i>
                <span class="text-xs">通知</span>
            </button>
        </div>
    </nav>

    <script>
        let isRecording = false;
        let recordingTimer = null;
        let startTime = null;

        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            // Start countdown
            let countdown = 3;
            const recordButton = document.getElementById('recordButton');
            const recordIcon = document.getElementById('recordIcon');
            const statusText = document.getElementById('statusText');
            
            const countdownInterval = setInterval(() => {
                statusText.textContent = `開始錄音倒數 ${countdown}`;
                recordButton.className = 'recording-button w-32 h-32 bg-warning rounded-full flex items-center justify-center shadow-lg pulse-animation';
                recordIcon.textContent = countdown;
                countdown--;
                
                if (countdown < 0) {
                    clearInterval(countdownInterval);
                    actuallyStartRecording();
                }
            }, 1000);
        }

        function actuallyStartRecording() {
            isRecording = true;
            const recordButton = document.getElementById('recordButton');
            const recordIcon = document.getElementById('recordIcon');
            const statusText = document.getElementById('statusText');
            const timer = document.getElementById('timer');
            const waveform = document.getElementById('waveform');
            
            // Update UI
            recordButton.className = 'recording-button w-32 h-32 bg-error rounded-full flex items-center justify-center shadow-lg pulse-animation';
            recordIcon.className = 'fas fa-stop text-white text-4xl';
            statusText.textContent = '錄音中...';
            timer.classList.remove('hidden');
            waveform.classList.remove('hidden');
            
            // Start timer
            startTime = Date.now();
            recordingTimer = setInterval(updateTimer, 1000);
            
            // Redirect to recording in progress page
            setTimeout(() => {
                location.href = 'SALES_003_recording_progress.html';
            }, 1000);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(recordingTimer);
            
            // Redirect to processing page
            location.href = 'SALES_004_recording_process.html';
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        // 當前篩選狀態
        let currentTimeFilter = 'today'; // 預設為今天
        let currentStatusFilter = 'all'; // 預設顯示全部狀態

        // 時間篩選
        function filterByTime(filter) {
            currentTimeFilter = filter;
            
            // 更新按鈕樣式
            document.querySelectorAll('.time-filter').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'time-filter bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap';
                } else {
                    btn.className = 'time-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap';
                }
            });
            
            applyFilters();
        }

        // 狀態篩選
        function filterByStatus(filter) {
            currentStatusFilter = filter;
            
            // 更新按鈕樣式
            document.querySelectorAll('.status-filter').forEach(btn => {
                if (btn.dataset.filter === currentStatusFilter) {
                    btn.className = 'status-filter bg-primary text-white px-4 py-2 rounded-full text-sm whitespace-nowrap';
                } else {
                    btn.className = 'status-filter bg-gray-200 text-text-secondary px-4 py-2 rounded-full text-sm whitespace-nowrap';
                }
            });
            
            applyFilters();
        }

        // 套用篩選
        function applyFilters() {
            const items = document.querySelectorAll('.recording-item');
            let visibleCount = 0;
            
            items.forEach(item => {
                let shouldShow = true;
                
                // 檢查時間篩選
                if (currentTimeFilter !== 'all') {
                    const itemTime = item.dataset.time;
                    if (currentTimeFilter === 'today' && itemTime !== 'today') {
                        shouldShow = false;
                    } else if (currentTimeFilter === 'week' && !['today', 'yesterday', 'week'].includes(itemTime)) {
                        shouldShow = false;
                    }
                }
                
                // 檢查狀態篩選
                if (currentStatusFilter !== 'all' && shouldShow) {
                    const itemStatus = item.dataset.status;
                    if (itemStatus !== currentStatusFilter) {
                        shouldShow = false;
                    }
                }
                
                // 顯示或隱藏項目
                if (shouldShow) {
                    item.style.display = 'block';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });
            
            // 如果沒有符合的項目，顯示提示
            const noResultsMsg = document.getElementById('noResultsMessage');
            if (visibleCount === 0) {
                if (!noResultsMsg) {
                    const msg = document.createElement('div');
                    msg.id = 'noResultsMessage';
                    msg.className = 'text-center py-8 text-text-tertiary';
                    msg.innerHTML = `
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>沒有符合篩選條件的錄音</p>
                    `;
                    document.getElementById('recordingsList').appendChild(msg);
                }
            } else if (noResultsMsg) {
                noResultsMsg.remove();
            }
        }

        // 重新上傳功能
        function retryUpload(recordingName) {
            // 顯示上傳中狀態
            const button = event.target;
            button.textContent = '上傳中...';
            button.disabled = true;
            
            // 模擬上傳過程
            setTimeout(() => {
                // 找到對應的錄音項目
                const item = button.closest('.recording-item');
                
                // 更新為處理中狀態
                item.dataset.status = 'processing';
                
                // 更新UI
                const statusIcon = item.querySelector('.w-8.h-8 i');
                statusIcon.className = 'fas fa-spinner fa-spin text-warning text-xs';
                statusIcon.parentElement.className = 'w-8 h-8 bg-warning/10 rounded-full flex items-center justify-center';
                
                const statusBadge = item.querySelector('.bg-error\\/10');
                if (statusBadge) {
                    statusBadge.className = 'text-xs bg-warning/10 text-warning px-2 py-1 rounded-full';
                    statusBadge.textContent = '處理中';
                }
                
                // 更新底部文字
                const bottomText = item.querySelector('.flex.items-center.justify-between');
                bottomText.innerHTML = `
                    <div class="flex items-center space-x-2 text-xs text-text-tertiary">
                        <i class="fas fa-folder"></i>
                        <span>${recordingName.replace(/_/g, ' / ')}</span>
                    </div>
                    <p class="text-xs text-text-secondary">重新上傳中...</p>
                `;
                
                // 移除紅色邊框
                item.classList.remove('border-l-4', 'border-error');
                
                // 重新套用篩選
                applyFilters();
            }, 1000);
        }

        function loadMoreRecordings() {
            // Load more recordings logic
            console.log('Loading more recordings...');
        }

        // Initialize modals and check permissions
        window.onload = function() {
            // 預設套用今天的篩選
            filterByTime('today');
            // Load modal components
            fetch('../includes/modals-all.html')
                .then(response => response.text())
                .then(html => {
                    const container = document.createElement('div');
                    container.id = 'modalContainer';
                    container.innerHTML = html;
                    document.body.appendChild(container);
                    
                    // Check microphone permission
                    checkMicrophonePermission();
                })
                .catch(error => {
                    console.error('Error loading modals:', error);
                });
        };
        
        function checkMicrophonePermission() {
            // Check if permission API is available
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'microphone' })
                    .then(function(result) {
                        if (result.state === 'prompt' || result.state === 'denied') {
                            // Show custom permission modal
                            setTimeout(() => {
                                showRecordingPermission();
                            }, 1000);
                        } else if (result.state === 'granted') {
                            console.log('Microphone permission already granted');
                        }
                    })
                    .catch(function(error) {
                        // Fallback for browsers that don't support permission query
                        checkMicrophoneFallback();
                    });
            } else {
                // Fallback for browsers that don't support permission API
                checkMicrophoneFallback();
            }
        }
        
        function checkMicrophoneFallback() {
            // Try to access microphone to check permission
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(function(stream) {
                        console.log('Microphone permission granted');
                        stream.getTracks().forEach(track => track.stop());
                    })
                    .catch(function(err) {
                        console.log('Microphone permission not granted');
                        // Show custom permission modal
                        setTimeout(() => {
                            showRecordingPermission();
                        }, 1000);
                    });
            }
        }
        
        // Override start recording to check permission
        const originalStartRecording = window.startRecording;
        window.startRecording = function() {
            // Check permission before starting
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(function(stream) {
                        stream.getTracks().forEach(track => track.stop());
                        // Permission granted, redirect to recording page
                        window.location.href = 'SALES_003_recording_progress.html';
                    })
                    .catch(function(err) {
                        // Permission denied, show modal
                        showRecordingPermission();
                    });
            }
        };
    </script>
</body>
