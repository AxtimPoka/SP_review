<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesAI - 編輯CASE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#2E5BFF',
                        'secondary': '#00C6AE',
                        'success': '#00D563',
                        'warning': '#FFB800',
                        'error': '#FF4757',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#666666',
                        'text-tertiary': '#999999'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow-sm px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <button onclick="history.back()" class="text-text-secondary">
                <i class="fas fa-arrow-left text-lg"></i>
            </button>
            <h1 class="text-lg font-semibold text-text-primary">編輯CASE</h1>
            <div class="flex items-center space-x-4">
                <div class="relative cursor-pointer" onclick="location.href='../common/COMMON_008_notification_center.html'">
                    <i class="fas fa-bell text-text-secondary text-lg"></i>
                    <span class="absolute -top-2 -right-2 bg-error text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">2</span>
                </div>
                <button onclick="location.href='../common/COMMON_001_settings.html'" class="text-text-secondary">
                    <i class="fas fa-cog text-lg"></i>
                </button>
                <button onclick="saveCase()" class="text-primary font-medium">儲存</button>
            </div>
        </div>
    </header>

    <main class="px-4 py-6 pb-24">
        <form class="space-y-6">
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <h3 class="font-semibold text-text-primary mb-4">基本資訊</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-text-secondary mb-2">CASE名稱</label>
                        <input type="text" value="壽險規劃" class="w-full border border-gray-200 rounded-lg px-4 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-text-secondary mb-2">狀態</label>
                        <select class="w-full border border-gray-200 rounded-lg px-4 py-2">
                            <option value="進行中" selected>進行中</option>
                            <option value="已成交">已成交</option>
                            <option value="暂停">暂停</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-text-secondary mb-2">產品類型</label>
                        <select class="w-full border border-gray-200 rounded-lg px-4 py-2">
                            <option value="壽險" selected>壽險</option>
                            <option value="醫療險">醫療險</option>
                            <option value="意外險">意外險</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl p-4 shadow-sm">
                <h3 class="font-semibold text-text-primary mb-4">備註</h3>
                <textarea class="w-full border border-gray-200 rounded-lg px-4 py-2 h-24" placeholder="更新CASE備註...">客戶對保障需求明確，建議加強價值塑造</textarea>
            </div>

            <div class="bg-white rounded-xl p-4 shadow-sm">
                <h3 class="font-semibold text-text-primary mb-4">錄音紀錄</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                            <p class="font-medium text-text-primary">初次諮詢</p>
                            <p class="text-sm text-text-tertiary">2024/08/12 | 28:35</p>
                        </div>
                        <span class="text-sm font-bold text-success">8.2分</span>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                            <p class="font-medium text-text-primary">需求診斷</p>
                            <p class="text-sm text-text-tertiary">2024/08/10 | 25:18</p>
                        </div>
                        <span class="text-sm font-bold text-primary">7.8分</span>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4">
        <div class="flex space-x-3">
            <button onclick="deleteCase()" class="bg-error text-white px-4 py-3 rounded-lg">
                <i class="fas fa-trash"></i>
            </button>
            <button onclick="history.back()" class="flex-1 bg-gray-200 text-text-secondary py-3 rounded-lg font-medium">取消</button>
            <button onclick="saveCase()" class="flex-1 bg-primary text-white py-3 rounded-lg font-medium">儲存更新</button>
        </div>
    </div>

    <script>
        function saveCase() {
            alert('CASE已更新！');
            history.back();
        }

        function deleteCase() {
            if (confirm('確定要刪除此CASE嗎？此操作不可復原。')) {
                alert('CASE已刪除');
                location.href = 'SALES_001_home.html';
            }
        }
    </script>
</body>
</html>
