<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesAI - CASE詳情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2E5BFF",
              secondary: "#00C6AE",
              success: "#00D563",
              warning: "#FFB800",
              error: "#FF4757",
              "text-primary": "#1A1A1A",
              "text-secondary": "#666666",
              "text-tertiary": "#999999",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm px-4 py-3 sticky top-0 z-10">
      <div class="flex items-center justify-between">
        <button onclick="history.back()" class="text-text-secondary">
          <i class="fas fa-arrow-left text-lg"></i>
        </button>
        <h1 class="text-lg font-semibold text-text-primary">初次諮詢 錄音</h1>
        <div class="flex items-center space-x-3">
          <button onclick="markComplete()" class="text-success">
            <i class="fas fa-check text-lg"></i>
          </button>
          <button onclick="showMenu()" class="text-text-secondary">
            <i class="fas fa-ellipsis-v text-lg"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Tab Navigation -->
    <div class="bg-white border-b border-gray-200">
      <div class="flex">
        <button
          class="tab-button flex-1 py-3 text-center border-b-2 border-primary text-primary font-medium"
          onclick="showTab('analysis')"
        >
          分析
        </button>
        <button
          class="tab-button flex-1 py-3 text-center border-b-2 border-transparent text-text-tertiary"
          onclick="showTab('recordings')"
        >
          逐字稿
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <main class="px-4 py-6 pb-24">
      <!-- Analysis Tab -->
      <div id="analysisTab" class="tab-content">
        <!-- Score Cards -->
        <div class="score-cards-container flex gap-3 mb-4">
          <div
            class="score-card flow active flex-1 rounded-lg p-4 text-white text-center cursor-pointer"
            onclick="selectDimension('flow', this)"
          >
            <div class="score-card-value text-3xl font-bold mb-1">94</div>
            <div class="score-card-label text-xs opacity-90 mb-2">
              流程遵守度
            </div>
            <button
              class="detail-btn px-3 py-1 text-xs bg-white/20 backdrop-blur rounded-full"
              onclick="showBreakdownModal('flow', event)"
            >
              詳細
            </button>
          </div>

          <div
            class="score-card skill flex-1 rounded-lg p-4 text-white text-center cursor-pointer"
            onclick="selectDimension('skill', this)"
          >
            <div class="score-card-value text-3xl font-bold mb-1">91</div>
            <div class="score-card-label text-xs opacity-90 mb-2">銷售技巧</div>
            <button
              class="detail-btn px-3 py-1 text-xs bg-white/20 backdrop-blur rounded-full"
              onclick="showBreakdownModal('skill', event)"
            >
              詳細
            </button>
          </div>

          <div
            class="score-card comm flex-1 rounded-lg p-4 text-white text-center cursor-pointer"
            onclick="selectDimension('comm', this)"
          >
            <div class="score-card-value text-3xl font-bold mb-1">96</div>
            <div class="score-card-label text-xs opacity-90 mb-2">溝通能力</div>
            <button
              class="detail-btn px-3 py-1 text-xs bg-white/20 backdrop-blur rounded-full"
              onclick="showBreakdownModal('comm', event)"
            >
              詳細
            </button>
          </div>
        </div>

        <!-- Transcript Highlights -->
        <div class="transcript-section">
          <div class="section-header">
            <div class="section-title">
              需要關注的片段
              <button
                class="attention-indicator"
                onclick="showInfoTooltip('待改進')"
              >
                ⚠️ 待改進
              </button>
            </div>
          </div>

          <div id="highlights-container">
            <!-- Content will be dynamically inserted -->
          </div>
        </div>


        <!-- Modal for Score Breakdown -->
        <div
          class="modal-overlay fixed inset-0 bg-black/50 hidden z-50"
          id="breakdown-modal-overlay"
          onclick="closeBreakdownModal()"
        >
          <div
            class="modal-container bg-white rounded-t-2xl absolute bottom-0 left-0 right-0 max-h-[80vh]"
            onclick="event.stopPropagation()"
          >
            <div
              class="modal-header flex justify-between items-center p-4 border-b"
            >
              <h3 class="modal-title text-lg font-semibold" id="modal-title">
                詳細評分
              </h3>
              <button
                class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"
                onclick="closeBreakdownModal()"
              >
                <i class="fas fa-times text-gray-600"></i>
              </button>
            </div>
            <div
              class="modal-body p-4 overflow-y-auto"
              id="modal-breakdown-content"
            >
              <!-- Content will be dynamically inserted -->
            </div>
          </div>
        </div>

        <!-- Modal for Highlight Details -->
        <div
          class="modal-overlay fixed inset-0 bg-black/50 hidden z-50"
          id="highlight-modal-overlay"
          onclick="closeHighlightModal()"
        >
          <div
            class="modal-container bg-white rounded-t-2xl absolute bottom-0 left-0 right-0 h-[80vh]"
            onclick="event.stopPropagation()"
          >
            <div
              class="modal-header flex justify-between items-center p-4 border-b bg-gray-50"
            >
              <h3
                class="modal-title text-lg font-semibold"
                id="highlight-modal-title"
              >
                對話詳情
              </h3>
              <button
                class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"
                onclick="closeHighlightModal()"
              >
                <i class="fas fa-times text-gray-600"></i>
              </button>
            </div>
            <div
              class="modal-body p-4 overflow-y-auto"
              style="max-height: calc(80vh - 80px)"
              id="highlight-modal-content"
            >
              <!-- Content will be dynamically inserted -->
            </div>
          </div>
        </div>
      </div>

      <!-- Recordings Tab -->
      <div id="recordingsTab" class="tab-content hidden">
        <div class="space-y-4">
          <!-- Segment List -->
          <div class="bg-white rounded-lg p-4">
            <div class="space-y-3">
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:04')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:04</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:19')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:19</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:26')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:26</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:30')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:30</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:34')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:34</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:36')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:36</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:41')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:41</div>
              </div>
              
              <div class="segment-item flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-all" onclick="seekToTime('00:04:45')">
                <div class="flex-1">
                  <p class="text-sm text-text-primary">一段中文對話</p>
                </div>
                <div class="text-xs text-text-tertiary font-mono">00:04:45</div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Audio Player -->
        <div class="fixed bottom-20 left-0 right-0 bg-white border-t border-gray-200 m-4 p-4 shadow-lg rounded-lg">
          <!-- Progress Bar -->
          <div class="mb-4">
            <div class="relative h-1 bg-gray-200 rounded-full cursor-pointer" onclick="handleProgressClick(event)">
              <div id="progressFill" class="absolute left-0 top-0 h-full bg-primary rounded-full transition-all duration-100" style="width: 0%"></div>
              <div id="progressDot" class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-error rounded-full border-2 border-white shadow-md transition-all duration-100" style="left: 0%"></div>
            </div>
            <div class="flex justify-between mt-2 text-xs text-text-tertiary font-mono">
              <span id="currentTimeDisplay">00:00:00</span>
              <span id="totalTimeDisplay">00:30:02</span>
            </div>
          </div>
          
          <!-- Controls -->
          <div class="flex justify-center items-center gap-6">
            
            <button class="p-2 text-text-primary hover:text-primary transition-colors" onclick="skipBackward()">
              <i class="fas fa-backward text-xl"></i>
            </button>
            
            <button id="playBtn" class="w-14 h-14 bg-primary rounded-full flex items-center justify-center text-white shadow-lg hover:bg-primary/90 transition-all" onclick="togglePlayPause()">
              <i id="playIcon" class="fas fa-play text-xl"></i>
            </button>
            
            <button class="p-2 text-text-primary hover:text-primary transition-colors" onclick="skipForward()">
              <i class="fas fa-forward text-xl"></i>
            </button>
             
          </div>
        </div>
      </div>

      <!-- Ask AI Tab -->
      <div id="askaiTab" class="tab-content hidden">
        <!-- AI Assistant Section -->
        <div
          class="bg-gradient-to-br from-primary/5 to-secondary/5 border border-primary/20 rounded-xl p-4 mb-4"
        >
          <div class="flex items-center">
            <div
              class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center mr-3"
            >
              <i class="fas fa-robot text-primary text-lg"></i>
            </div>
            <div class="flex-1">
              <h3 class="text-base font-semibold text-text-primary">
                AI 智能助手
              </h3>
              <p class="text-xs text-text-secondary">
                詢問關於此CASE的任何問題
              </p>
            </div>
          </div>
        </div>

        <!-- Quick Questions -->
        <div class="bg-white rounded-xl p-4 mb-4">
          <h4 class="text-sm font-semibold text-text-primary mb-3">快速提問</h4>
          <div class="space-y-2">
            <button
              class="w-full p-3 text-left border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 transition-colors group"
              onclick="askAIQuestion('分析客戶的主要異議點和擔憂')"
            >
              <div class="flex items-center">
                <i class="fas fa-exclamation-triangle text-warning mr-3"></i>
                <div class="flex-1">
                  <div
                    class="text-sm font-medium text-text-primary group-hover:text-primary"
                  >
                    客戶的主要異議是什麼？
                  </div>
                  <div class="text-xs text-text-tertiary">
                    分析對話中的異議點
                  </div>
                </div>
              </div>
            </button>

            <button
              class="w-full p-3 text-left border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 transition-colors group"
              onclick="askAIQuestion('提供提升成交率的具體建議')"
            >
              <div class="flex items-center">
                <i class="fas fa-chart-line text-success mr-3"></i>
                <div class="flex-1">
                  <div
                    class="text-sm font-medium text-text-primary group-hover:text-primary"
                  >
                    如何提升成交機率？
                  </div>
                  <div class="text-xs text-text-tertiary">獲取成交策略建議</div>
                </div>
              </div>
            </button>

            <button
              class="w-full p-3 text-left border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 transition-colors group"
              onclick="askAIQuestion('分析SPIN問句的使用情況和改進建議')"
            >
              <div class="flex items-center">
                <i class="fas fa-comments text-primary mr-3"></i>
                <div class="flex-1">
                  <div
                    class="text-sm font-medium text-text-primary group-hover:text-primary"
                  >
                    SPIN問句運用分析
                  </div>
                  <div class="text-xs text-text-tertiary">評估話術技巧</div>
                </div>
              </div>
            </button>

            <button
              class="w-full p-3 text-left border border-gray-200 rounded-lg hover:border-primary hover:bg-primary/5 transition-colors group"
              onclick="askAIQuestion('找出錯失的銷售機會點')"
            >
              <div class="flex items-center">
                <i class="fas fa-lightbulb text-warning mr-3"></i>
                <div class="flex-1">
                  <div
                    class="text-sm font-medium text-text-primary group-hover:text-primary"
                  >
                    錯失了哪些機會？
                  </div>
                  <div class="text-xs text-text-tertiary">識別改善機會</div>
                </div>
              </div>
            </button>
          </div>
        </div>

        <!-- Query Input -->
        <div class="bg-white rounded-xl p-4 mb-4">
          <div class="relative">
            <textarea
              id="aiQueryInput"
              placeholder="輸入您的問題...例如：分析客戶在12:45的保費異議，提供更好的應對方式"
              rows="3"
              class="w-full px-3 py-2 pr-20 border border-gray-200 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors text-sm"
            ></textarea>
            <div class="absolute bottom-2 right-2 flex items-center gap-2">
              <button
                id="voiceInputBtn"
                class="p-2 text-text-tertiary hover:text-primary transition-colors"
              >
                <i class="fas fa-microphone"></i>
              </button>
              <button
                id="submitAIQuery"
                class="px-4 py-1.5 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed text-sm"
                onclick="submitAIQuery()"
                disabled
              >
                發送
              </button>
            </div>
          </div>
        </div>

        <!-- AI Response Area -->
        <div id="aiResponseArea" class="hidden">
          <div class="bg-white rounded-xl p-4">
            <div class="flex items-start gap-3 mb-3">
              <div
                class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center"
              >
                <i class="fas fa-robot text-primary text-sm"></i>
              </div>
              <div class="flex-1">
                <div class="text-sm font-semibold text-primary mb-1">
                  AI 分析結果
                </div>
                <div
                  id="aiResponseContent"
                  class="text-sm text-text-secondary leading-relaxed"
                >
                  <!-- AI response will be inserted here -->
                </div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div
              class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-100"
            >
              <button
                class="flex items-center px-3 py-1 text-xs text-text-tertiary hover:text-primary transition-colors"
              >
                <i class="fas fa-copy mr-1"></i>
                複製
              </button>
              <button
                class="flex items-center px-3 py-1 text-xs text-text-tertiary hover:text-primary transition-colors"
              >
                <i class="fas fa-share mr-1"></i>
                分享
              </button>
              <button
                class="flex items-center px-3 py-1 text-xs text-primary hover:text-primary/80 transition-colors"
              >
                <i class="fas fa-bookmark mr-1"></i>
                儲存建議
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

        <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="grid grid-cols-4 py-2">
            <button class="flex flex-col items-center py-2 text-primary">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-xs">首頁</span>
            </button>
            <button class="flex flex-col items-center py-2 text-text-tertiary" onclick="location.href='SALES_010_success_cases.html'">
                <i class="fas fa-trophy text-lg mb-1"></i>
                <span class="text-xs">案例</span>
            </button>
            <button class="flex flex-col items-center py-2 text-text-tertiary" onclick="location.href='SALES_003_recording_progress.html'">
                <i class="fas fa-microphone text-lg mb-1"></i>
                <span class="text-xs">錄音</span>
            </button>

                <span class="text-xs">通知</span>
            </button>
        </div>
    </nav>

    <style>

    <script>
      // 評分細項資料 - 從 SALES_018 複製
      const scoreBreakdowns = {
        flow: {
          name: "流程遵守度",
          totalScore: 94,
          items: [
            { id: "1.1", name: "銷售流程完整性", score: 70 },
            { id: "1.2", name: "需求診斷流程", score: 96 },

      // Audio Player Variables and Functions
      let isPlaying = false;
      let currentTime = 0;
      let duration = 1802; // 30:02 in seconds
      let progressInterval;

      function togglePlayPause() {
        const playIcon = document.getElementById('playIcon');
        isPlaying = !isPlaying;
        
        if (isPlaying) {
          playIcon.className = 'fas fa-pause text-xl';
          startProgress();
        } else {
          playIcon.className = 'fas fa-play text-xl';
          stopProgress();
        }
      }

      function startProgress() {
        progressInterval = setInterval(() => {
          if (currentTime < duration) {
            currentTime += 0.1;
            updateProgress();
          } else {
            stopProgress();
            isPlaying = false;
            document.getElementById('playIcon').className = 'fas fa-play text-xl';
          }
        }, 100);
      }

      function stopProgress() {
        clearInterval(progressInterval);
      }

      function updateProgress() {
        const percentage = (currentTime / duration) * 100;
        document.getElementById('progressFill').style.width = percentage + '%';
        document.getElementById('progressDot').style.left = percentage + '%';
        
        // Update time display
        const currentTimeStr = formatTime(currentTime);
        document.getElementById('currentTimeDisplay').textContent = currentTimeStr;
      }

      function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function seekToTime(timeStr) {
        const [m, s] = timeStr.split(':').slice(1).map(Number);
        currentTime = m * 60 + s;
        updateProgress();
        
        // Auto-play when seeking
        if (!isPlaying) {
          togglePlayPause();
        }
      }

      function handleProgressClick(event) {
        const progressBar = event.currentTarget;
        const rect = progressBar.getBoundingClientRect();
        const percentage = (event.clientX - rect.left) / rect.width;
        currentTime = duration * percentage;
        updateProgress();
      }

      function skipBackward() {
        currentTime = Math.max(0, currentTime - 15);
        updateProgress();
      }

      function skipForward() {
        currentTime = Math.min(duration, currentTime + 15);
        updateProgress();
      }

      function toggleMenu() {
        // Show playback speed options
        showActionSheet({
          title: "播放選項",
          actions: [
            {
              text: "0.5x 速度",
              handler: () => {
                console.log("Set speed to 0.5x");
              }
            },
            {
              text: "1.0x 速度（正常）",
              handler: () => {
                console.log("Set speed to 1.0x");
              }
            },
            {
              text: "1.5x 速度",
              handler: () => {
                console.log("Set speed to 1.5x");
              }
            },
            {
              text: "2.0x 速度",
              handler: () => {
                console.log("Set speed to 2.0x");

          ]

      function toggleTranscript() {
        // Toggle between recordings tab and analysis tab
        const recordingsTab = document.getElementById('recordingsTab');
        const analysisTab = document.getElementById('analysisTab');
        
        if (!recordingsTab.classList.contains('hidden')) {
          // Switch to analysis tab
          showTab('analysis');
          // Update tab buttons
          document.querySelectorAll('.tab-button').forEach((btn) => {
            btn.classList.remove('border-primary', 'text-primary');
            btn.classList.add('border-transparent', 'text-text-tertiary');
          });
          document.querySelectorAll('.tab-button')[0].classList.remove('border-transparent', 'text-text-tertiary');
          document.querySelectorAll('.tab-button')[0].classList.add('border-primary', 'text-primary');
        }
      }

      // Initialize content on page load
      document.addEventListener("DOMContentLoaded", function () {
        updateContent("flow");
        
        // Enter key to send message in discussion
        const input = document.getElementById('newDiscussionMessage');
        if (input) {
          input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
              addDiscussionMessage();
            }
          });
        }
      });

      function showTab(tabName) {
        // Hide all tab contents
        document.querySelectorAll(".tab-content").forEach((tab) => {
          tab.classList.add("hidden");
        });

        // Remove active styles from all tab buttons
        document.querySelectorAll(".tab-button").forEach((btn) => {
          btn.classList.remove("border-primary", "text-primary");
          btn.classList.add("border-transparent", "text-text-tertiary");
        });

        // Show selected tab content
        document.getElementById(tabName + "Tab").classList.remove("hidden");

        // Add active styles to selected tab button
        event.target.classList.remove(
          "border-transparent",
          "text-text-tertiary"
        );
        event.target.classList.add("border-primary", "text-primary");
      }

      function markComplete() {
        // Use custom modal instead of confirm
        showCaseSuccess({
          onSubmit: (data) => {
            console.log("Case marked as complete:", data);
            showWarning({
              title: "成交成功！",
              message: "恭喜！此CASE已標記為成交，資料已提交。",
              onConfirm: () => {
                location.href = "SALES_001_home.html";
              },
            });
          },
        });
      }

      function showMenu() {
        showActionSheet({
          title: "CASE操作",
          actions: [
            {
              text: "編輯CASE",
              handler: () => {
                location.href = "SALES_008_edit_case.html";
              },
            },
            {
              text: "複製CASE",
              handler: () => {
                showLoading("正在複製CASE...");

                  hideLoading();
                  showWarning({
                    title: "複製成功",

                  });
                }, 1000);

            },
            {
              text: "刪除CASE",
              destructive: true,
              handler: () => {
                showConfirm({
                  title: "刪除CASE",
                  message: "確定要刪除此CASE嗎？此操作無法復原。",
                  onConfirm: () => {
                    showLoading("正在刪除...");
                    setTimeout(() => {
                      hideLoading();
                      location.href = "SALES_005_customer_detail.html";
                    }, 1000);
                  },
                });

            },
          ],

      }

      // Show info tooltip function
      function showInfoTooltip(type) {
        let message = "";
        if (type === "待改進") {
          message = "系統自動抓取詳細評分中低於70分項目的實際對話片段";
        } else if (type === "精準推薦") {
          message = "直接對應您的弱項，提供團隊成員90分以上的實際成功對話案例";
        }

        // Create and show tooltip
        const tooltip = document.createElement("div");
        tooltip.className =
          "fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-4";
        tooltip.innerHTML = `
                <div class="bg-white rounded-lg p-4 max-w-sm w-full shadow-xl animate-fadeIn">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-info text-primary text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-dark mb-2">${type}</h4>
                            <p class="text-sm text-gray-medium leading-relaxed">${message}</p>
                        </div>
                    </div>
                    <button onclick="this.closest('.fixed').remove()" 
                            class="mt-4 w-full py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors text-sm">
                        我知道了
                    </button>
                </div>
            `;
        document.body.appendChild(tooltip);

        // Auto-remove after 5 seconds
        setTimeout(() => {
          if (tooltip.parentNode) {
            tooltip.remove();
          }
        }, 5000);
      }

      // Ask AI Functions
      function askAIQuestion(question) {
        const aiQueryInput = document.getElementById("aiQueryInput");
        const submitBtn = document.getElementById("submitAIQuery");

        aiQueryInput.value = question;
        submitBtn.disabled = false;

        // Auto-submit the question
        submitAIQuery();
      }

      function submitAIQuery() {
        const aiQueryInput = document.getElementById("aiQueryInput");
        const query = aiQueryInput.value.trim();

        if (!query) return;

        const submitBtn = document.getElementById("submitAIQuery");
        const responseArea = document.getElementById("aiResponseArea");
        const responseContent = document.getElementById("aiResponseContent");

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        // Simulate AI processing
        setTimeout(() => {
          // Show response area
          responseArea.classList.remove("hidden");

          // Generate sample response based on query
          let response = "";

          if (query.includes("異議")) {
            response = `
                        <div class="space-y-3">
                            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                                <h5 class="font-semibold text-yellow-800 mb-2">🎯 主要異議點</h5>
                                <ul class="text-yellow-700 text-sm space-y-1">
                                    <li>• 保費價格較預期高出30%</li>
                                    <li>• 擔心理賠程序複雜</li>
                                    <li>• 對保障範圍有疑慮</li>
                                </ul>
                            </div>
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                <h5 class="font-semibold text-blue-800 mb-2">💡 建議回應</h5>
                                <p class="text-blue-700 text-sm">運用價值對比法，強調長期保障的投資報酬率，並提供成功理賠案例。</p>
                            </div>
                        </div>
                    `;
          } else if (query.includes("成交") || query.includes("機率")) {
            response = `
                        <div class="space-y-3">
                            <div class="bg-green-50 border border-green-200 rounded-lg p-3">
                                <h5 class="font-semibold text-green-800 mb-2">📈 成交機率評估</h5>
                                <div class="flex items-center mb-2">
                                    <div class="flex-1 bg-gray-200 rounded-full h-2">
                                        <div class="bg-green-500 h-2 rounded-full" style="width: 75%"></div>
                                    </div>
                                    <span class="ml-2 text-green-700 font-semibold">75%</span>
                                </div>
                                <p class="text-green-700 text-sm">客戶有明確需求且預算充足</p>
                            </div>
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                <h5 class="font-semibold text-blue-800 mb-2">🎯 提升策略</h5>
                                <ul class="text-blue-700 text-sm space-y-1">
                                    <li>• 強化家庭保障的必要性</li>
                                    <li>• 提供分期付款方案</li>
                                    <li>• 安排家庭決策者共同參與</li>
                                </ul>
                            </div>
                        </div>
                    `;
          } else if (query.includes("SPIN")) {
            response = `
                        <div class="space-y-3">
                            <div class="bg-purple-50 border border-purple-200 rounded-lg p-3">
                                <h5 class="font-semibold text-purple-800 mb-2">📊 SPIN問句分析</h5>
                                <div class="space-y-2">
                                    <div class="flex items-center justify-between">
                                        <span class="text-purple-700 text-sm">情況問句 (S)</span>
                                        <span class="text-purple-800 font-semibold">8/10</span>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-purple-700 text-sm">問題問句 (P)</span>
                                        <span class="text-orange-600 font-semibold">5/10</span>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-purple-700 text-sm">暗示問句 (I)</span>
                                        <span class="text-orange-600 font-semibold">4/10</span>
                                    </div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-purple-700 text-sm">需求確認 (N)</span>
                                        <span class="text-purple-800 font-semibold">7/10</span>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                <h5 class="font-semibold text-blue-800 mb-2">💡 改進建議</h5>
                                <p class="text-blue-700 text-sm">加強問題問句和暗示問句的運用，深入挖掘客戶痛點。</p>
                            </div>
                        </div>
                    `;
          } else {
            response = `
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                            <p class="text-gray-700 text-sm">根據您的問題「${query}」，我建議您關注以下幾個方面：</p>
                            <ul class="mt-2 text-gray-600 text-sm space-y-1">
                                <li>• 深入了解客戶需求</li>
                                <li>• 運用適當的銷售技巧</li>
                                <li>• 建立信任關係</li>
                                <li>• 持續追蹤和服務</li>
                            </ul>
                        </div>
                    `;
          }

          responseContent.innerHTML = response;

          // Reset button
          submitBtn.disabled = false;
          submitBtn.innerHTML = "發送";

          // Clear input
          aiQueryInput.value = "";
        }, 1500);
      }

      // Enable/disable submit button based on input
      document.addEventListener("DOMContentLoaded", function () {
        const aiQueryInput = document.getElementById("aiQueryInput");
        const submitBtn = document.getElementById("submitAIQuery");

        if (aiQueryInput) {
          aiQueryInput.addEventListener("input", function () {
            submitBtn.disabled = this.value.trim().length === 0;
          });
        }
      });

      // Load modal components on page load
      window.addEventListener("DOMContentLoaded", function () {
        fetch("../includes/modals-all.html")
          .then((response) => response.text())
          .then((html) => {
            const container = document.createElement("div");
            container.id = "modalContainer";
            container.innerHTML = html;
            document.body.appendChild(container);
          })
          .catch((error) => {
            console.error("Error loading modals:", error);
          });
      });
    </script>
