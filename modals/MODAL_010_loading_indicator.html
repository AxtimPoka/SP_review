<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAL_010 - 載入中指示器 | SalesAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Loading Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        @keyframes dots-bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }
        
        @keyframes progress-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .animate-spin-slow { animation: spin 2s linear infinite; }
        .animate-pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }
        .dot-1 { animation: dots-bounce 1.4s ease-in-out infinite; }
        .dot-2 { animation: dots-bounce 1.4s ease-in-out infinite 0.2s; }
        .dot-3 { animation: dots-bounce 1.4s ease-in-out infinite 0.4s; }
        
        /* Skeleton Screen */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'gray-dark': '#1A1A1A',
                        'gray-medium': '#666666',
                        'gray-light': '#999999',
                        'gray-bg': '#F8F9FA',
                        'gray-border': '#E5E5E5'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-bg">
    <!-- Demo Container -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
            <h1 class="text-2xl font-bold text-gray-dark mb-2">MODAL_010</h1>
            <h2 class="text-lg text-gray-medium mb-6">載入中指示器</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="loadingIndicator.show('spinner')" 
                        class="px-4 py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors text-sm">
                    Spinner 載入
                </button>
                
                <button onclick="loadingIndicator.show('dots')" 
                        class="px-4 py-3 bg-secondary text-white rounded-lg hover:bg-secondary/90 transition-colors text-sm">
                    Dots 載入
                </button>
                
                <button onclick="loadingIndicator.show('progress')" 
                        class="px-4 py-3 bg-success text-white rounded-lg hover:bg-success/90 transition-colors text-sm">
                    進度條載入
                </button>
                
                <button onclick="loadingIndicator.show('skeleton')" 
                        class="px-4 py-3 bg-warning text-white rounded-lg hover:bg-warning/90 transition-colors text-sm">
                    骨架屏載入
                </button>
                
                <button onclick="loadingIndicator.show('fullscreen')" 
                        class="col-span-2 px-4 py-3 bg-gray-dark text-white rounded-lg hover:bg-gray-dark/90 transition-colors text-sm">
                    全螢幕載入
                </button>
            </div>
            
            <div class="mt-6 p-4 bg-gray-bg rounded-lg">
                <h3 class="font-bold text-gray-dark mb-2">組件說明：</h3>
                <ul class="text-sm text-gray-medium space-y-1">
                    <li>• 多種載入動畫樣式</li>
                    <li>• 骨架屏預載入效果</li>
                    <li>• 進度條顯示</li>
                    <li>• 支援全螢幕遮罩</li>
                    <li>• 自定義載入文字</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Spinner Loading -->
    <div id="spinnerLoading" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="bg-white rounded-2xl p-8 shadow-xl">
                <div class="relative w-16 h-16 mx-auto mb-4">
                    <div class="absolute inset-0 border-4 border-primary/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-primary border-t-transparent rounded-full animate-spin-slow"></div>
                    <div class="absolute inset-0 scale-75 border-4 border-secondary border-b-transparent rounded-full animate-spin-slow" style="animation-direction: reverse;"></div>
                </div>
                <p class="text-gray-dark font-medium text-center">載入中...</p>
            </div>
        </div>
    </div>

    <!-- Dots Loading -->
    <div id="dotsLoading" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="bg-white rounded-2xl p-8 shadow-xl">
                <div class="flex space-x-2 justify-center mb-4">
                    <div class="w-3 h-3 bg-primary rounded-full dot-1"></div>
                    <div class="w-3 h-3 bg-secondary rounded-full dot-2"></div>
                    <div class="w-3 h-3 bg-success rounded-full dot-3"></div>
                </div>
                <p class="text-gray-dark font-medium text-center">處理中...</p>
            </div>
        </div>
    </div>

    <!-- Progress Loading -->
    <div id="progressLoading" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="bg-white rounded-2xl p-8 shadow-xl min-w-[300px]">
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-gray-dark font-medium">上傳中...</p>
                        <span id="progressPercent" class="text-sm text-gray-medium">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                        <div id="progressBar" class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <p id="progressStatus" class="text-sm text-gray-medium text-center">準備中...</p>
            </div>
        </div>
    </div>

    <!-- Skeleton Loading -->
    <div id="skeletonLoading" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-white">
            <div class="max-w-md mx-auto p-4">
                <!-- Header Skeleton -->
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-12 h-12 skeleton rounded-full"></div>
                    <div class="flex-1">
                        <div class="h-4 skeleton rounded mb-2"></div>
                        <div class="h-3 skeleton rounded w-2/3"></div>
                    </div>
                </div>
                
                <!-- Content Skeleton -->
                <div class="space-y-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="h-4 skeleton rounded mb-3"></div>
                        <div class="h-3 skeleton rounded mb-2"></div>
                        <div class="h-3 skeleton rounded w-4/5"></div>
                    </div>
                    
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="h-4 skeleton rounded mb-3"></div>
                        <div class="h-3 skeleton rounded mb-2"></div>
                        <div class="h-3 skeleton rounded w-3/4"></div>
                    </div>
                    
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="h-4 skeleton rounded mb-3"></div>
                        <div class="h-3 skeleton rounded mb-2"></div>
                        <div class="h-3 skeleton rounded w-5/6"></div>
                    </div>
                </div>
                
                <!-- Button Skeleton -->
                <div class="mt-6">
                    <div class="h-12 skeleton rounded-lg"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Loading -->
    <div id="fullscreenLoading" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-primary flex flex-col items-center justify-center">
            <!-- Logo Animation -->
            <div class="relative mb-8">
                <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-lg">
                    <span class="text-2xl font-bold text-primary">AI</span>
                </div>
                <div class="absolute inset-0 bg-white rounded-2xl animate-pulse-ring"></div>
            </div>
            
            <!-- Loading Text -->
            <h2 class="text-white text-xl font-medium mb-2">SalesAI</h2>
            <p class="text-white/80 text-sm mb-8">智能銷售分析系統</p>
            
            <!-- Loading Bar -->
            <div class="w-48 h-1 bg-white/20 rounded-full overflow-hidden">
                <div class="h-full bg-white rounded-full" style="animation: progress-bar 2s ease-in-out infinite;"></div>
            </div>
            
            <!-- Tips -->
            <div class="absolute bottom-8 left-0 right-0 text-center">
                <p id="loadingTip" class="text-white/60 text-xs px-4">正在載入資源...</p>
            </div>
        </div>
    </div>

    <script>
        class LoadingIndicator {
            constructor() {
                this.types = {
                    spinner: 'spinnerLoading',
                    dots: 'dotsLoading',
                    progress: 'progressLoading',
                    skeleton: 'skeletonLoading',
                    fullscreen: 'fullscreenLoading'
                };
                this.currentLoader = null;
                this.progressTimer = null;
                this.tips = [
                    '正在載入資源...',
                    '正在優化體驗...',
                    '正在準備數據...',
                    '即將完成...'
                ];
                this.tipIndex = 0;
            }
            
            show(type = 'spinner', options = {}) {
                // Hide any current loader
                this.hide();
                
                const loaderId = this.types[type];
                if (!loaderId) return;
                
                const loader = document.getElementById(loaderId);
                if (!loader) return;
                
                this.currentLoader = loader;
                loader.classList.remove('hidden');
                
                // Type-specific initialization
                switch(type) {
                    case 'progress':
                        this.startProgress(options.duration || 3000);
                        break;
                    case 'skeleton':
                        setTimeout(() => this.hide(), options.duration || 2000);
                        break;
                    case 'fullscreen':
                        this.startTipRotation();
                        setTimeout(() => this.hide(), options.duration || 3000);
                        break;
                    default:
                        setTimeout(() => this.hide(), options.duration || 2000);
                }
            }
            
            hide() {
                if (this.currentLoader) {
                    this.currentLoader.classList.add('hidden');
                    this.currentLoader = null;
                }
                
                // Clear timers
                if (this.progressTimer) {
                    clearInterval(this.progressTimer);
                    this.progressTimer = null;
                }
                
                if (this.tipTimer) {
                    clearInterval(this.tipTimer);
                    this.tipTimer = null;
                }
            }
            
            startProgress(duration) {
                const progressBar = document.getElementById('progressBar');
                const progressPercent = document.getElementById('progressPercent');
                const progressStatus = document.getElementById('progressStatus');
                
                let progress = 0;
                const increment = 100 / (duration / 100);
                
                this.progressTimer = setInterval(() => {
                    progress += increment;
                    
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(this.progressTimer);
                        progressStatus.textContent = '完成！';
                        setTimeout(() => this.hide(), 500);
                    }
                    
                    progressBar.style.width = `${progress}%`;
                    progressPercent.textContent = `${Math.round(progress)}%`;
                    
                    // Update status text
                    if (progress < 30) {
                        progressStatus.textContent = '準備中...';
                    } else if (progress < 60) {
                        progressStatus.textContent = '處理中...';
                    } else if (progress < 90) {
                        progressStatus.textContent = '即將完成...';
                    }
                }, 100);
            }
            
            startTipRotation() {
                const tipElement = document.getElementById('loadingTip');
                
                this.tipTimer = setInterval(() => {
                    this.tipIndex = (this.tipIndex + 1) % this.tips.length;
                    tipElement.style.opacity = '0';
                    
                    setTimeout(() => {
                        tipElement.textContent = this.tips[this.tipIndex];
                        tipElement.style.opacity = '1';
                    }, 300);
                }, 2000);
            }
            
            // Update progress manually
            updateProgress(percent, status) {
                const progressBar = document.getElementById('progressBar');
                const progressPercent = document.getElementById('progressPercent');
                const progressStatus = document.getElementById('progressStatus');
                
                if (progressBar) progressBar.style.width = `${percent}%`;
                if (progressPercent) progressPercent.textContent = `${percent}%`;
                if (progressStatus && status) progressStatus.textContent = status;
            }
        }
        
        // Initialize
        const loadingIndicator = new LoadingIndicator();
        
        // Prevent scrolling when fullscreen loader is active
        document.getElementById('fullscreenLoading').addEventListener('wheel', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
