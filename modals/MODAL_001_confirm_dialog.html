<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAL_001 - 確認對話框</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#666666',
                        'text-tertiary': '#999999'
                    },
                    boxShadow: {
                        'level-4': '0px 8px 24px rgba(0,0,0,0.15)'
                    }
                }
            }
        }
    </script>
    <style>
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
        
        .modal-enter {
            animation: modalEnter 0.3s ease-out;
        }
        
        .modal-exit {
            animation: modalExit 0.2s ease-in;
        }
        
        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        @keyframes modalExit {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
        }
        
        /* 防止背景滾動 */
        .no-scroll {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- 示例觸發按鈕 -->
    <div class="max-w-sm mx-auto space-y-4">
        <h1 class="text-2xl font-bold text-text-primary text-center mb-8">MODAL_001 - 確認對話框</h1>
        
        <div class="space-y-4">
            <button id="deleteBtn" class="w-full bg-error text-white py-3 px-6 rounded-lg font-medium">
                刪除項目
            </button>
            
            <button id="logoutBtn" class="w-full bg-warning text-white py-3 px-6 rounded-lg font-medium">
                登出帳號
            </button>
            
            <button id="submitBtn" class="w-full bg-primary text-white py-3 px-6 rounded-lg font-medium">
                提交表單
            </button>
        </div>
        
        <div class="mt-8 p-4 bg-white rounded-lg shadow">
            <h3 class="font-semibold text-text-primary mb-2">組件說明：</h3>
            <ul class="text-sm text-text-secondary space-y-1">
                <li>• 通用確認對話框組件</li>
                <li>• 支援自定義標題和內容</li>
                <li>• 可配置按鈕文字和樣式</li>
                <li>• 支援ESC鍵關閉</li>
                <li>• 支援淡入淡出動畫效果</li>
                <li>• 防止背景滾動</li>
            </ul>
        </div>
    </div>

    <!-- 確認對話框模態框 -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden">
        <!-- 背景遮罩 -->
        <div class="modal-backdrop fixed inset-0 bg-black bg-opacity-50 transition-opacity duration-300"></div>
        
        <!-- 模態框內容 -->
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="modal-enter bg-white rounded-xl shadow-level-4 w-full max-w-sm mx-auto">
                <!-- 模態框頭部 -->
                <div class="p-6 border-b border-gray-100">
                    <div class="flex items-center justify-center mb-4">
                        <div id="modalIcon" class="w-12 h-12 rounded-full flex items-center justify-center">
                            <!-- 圖標將由JavaScript動態插入 -->
                        </div>
                    </div>
                    <h3 id="modalTitle" class="text-lg font-semibold text-text-primary text-center">
                        確認操作
                    </h3>
                </div>
                
                <!-- 模態框內容 -->
                <div class="p-6">
                    <p id="modalMessage" class="text-text-secondary text-center leading-relaxed">
                        您確定要執行此操作嗎？此動作無法復原。
                    </p>
                </div>
                
                <!-- 模態框按鈕 -->
                <div class="p-6 pt-0 flex gap-3">
                    <button id="cancelBtn" class="flex-1 bg-gray-100 text-text-secondary py-3 px-4 rounded-lg font-medium hover:bg-gray-200 transition-colors">
                        取消
                    </button>
                    <button id="confirmBtn" class="flex-1 bg-primary text-white py-3 px-4 rounded-lg font-medium hover:bg-blue-600 transition-colors">
                        確認
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 確認對話框類
        class ConfirmModal {
            constructor() {
                this.modal = document.getElementById('confirmModal');
                this.modalIcon = document.getElementById('modalIcon');
                this.modalTitle = document.getElementById('modalTitle');
                this.modalMessage = document.getElementById('modalMessage');
                this.cancelBtn = document.getElementById('cancelBtn');
                this.confirmBtn = document.getElementById('confirmBtn');
                this.backdrop = this.modal.querySelector('.modal-backdrop');
                this.modalContent = this.modal.querySelector('.modal-enter');
                
                this.onConfirm = null;
                this.onCancel = null;
                
                this.init();
            }
            
            init() {
                // ESC鍵關閉
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.modal.classList.contains('hidden')) {
                        this.hide();
                    }
                });
                
                // 背景點擊關閉
                this.backdrop.addEventListener('click', () => {
                    this.hide();
                });
                
                // 取消按鈕
                this.cancelBtn.addEventListener('click', () => {
                    this.hide();
                    if (this.onCancel) this.onCancel();
                });
                
                // 確認按鈕
                this.confirmBtn.addEventListener('click', () => {
                    this.hide();
                    if (this.onConfirm) this.onConfirm();
                });
            }
            
            show(options = {}) {
                const {
                    title = '確認操作',
                    message = '您確定要執行此操作嗎？',
                    confirmText = '確認',
                    cancelText = '取消',
                    type = 'default', // default, warning, danger
                    onConfirm = null,
                    onCancel = null
                } = options;
                
                // 設置內容
                this.modalTitle.textContent = title;
                this.modalMessage.textContent = message;
                this.confirmBtn.textContent = confirmText;
                this.cancelBtn.textContent = cancelText;
                
                // 設置圖標和樣式
                this.setModalType(type);
                
                // 設置回調函數
                this.onConfirm = onConfirm;
                this.onCancel = onCancel;
                
                // 防止背景滾動
                document.body.classList.add('no-scroll');
                
                // 顯示模態框
                this.modal.classList.remove('hidden');
                this.modalContent.classList.remove('modal-exit');
                this.modalContent.classList.add('modal-enter');
                
                // 聚焦到取消按鈕（更安全的默認選項）
                setTimeout(() => {
                    this.cancelBtn.focus();
                }, 100);
            }
            
            hide() {
                this.modalContent.classList.remove('modal-enter');
                this.modalContent.classList.add('modal-exit');
                
                setTimeout(() => {
                    this.modal.classList.add('hidden');
                    document.body.classList.remove('no-scroll');
                }, 200);
            }
            
            setModalType(type) {
                // 清除之前的樣式
                this.modalIcon.className = 'w-12 h-12 rounded-full flex items-center justify-center';
                this.confirmBtn.className = 'flex-1 py-3 px-4 rounded-lg font-medium transition-colors';
                
                switch (type) {
                    case 'warning':
                        this.modalIcon.classList.add('bg-warning', 'bg-opacity-20');
                        this.modalIcon.innerHTML = '<svg class="w-6 h-6 text-warning" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>';
                        this.confirmBtn.classList.add('bg-warning', 'text-white', 'hover:bg-yellow-600');
                        break;
                        
                    case 'danger':
                        this.modalIcon.classList.add('bg-error', 'bg-opacity-20');
                        this.modalIcon.innerHTML = '<svg class="w-6 h-6 text-error" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd"></path><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>';
                        this.confirmBtn.classList.add('bg-error', 'text-white', 'hover:bg-red-600');
                        break;
                        
                    default:
                        this.modalIcon.classList.add('bg-primary', 'bg-opacity-20');
                        this.modalIcon.innerHTML = '<svg class="w-6 h-6 text-primary" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>';
                        this.confirmBtn.classList.add('bg-primary', 'text-white', 'hover:bg-blue-600');
                        break;
                }
            }
        }
        
        // 初始化確認對話框
        const confirmModal = new ConfirmModal();
        
        // 示例用法
        document.getElementById('deleteBtn').addEventListener('click', () => {
            confirmModal.show({
                title: '刪除確認',
                message: '您確定要刪除此項目嗎？此操作無法復原。',
                type: 'danger',
                confirmText: '刪除',
                cancelText: '取消',
                onConfirm: () => {
                    alert('項目已刪除！');
                },
                onCancel: () => {
                    console.log('取消刪除');
                }
            });
        });
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            confirmModal.show({
                title: '登出確認',
                message: '您確定要登出嗎？未保存的變更將會遺失。',
                type: 'warning',
                confirmText: '登出',
                cancelText: '取消',
                onConfirm: () => {
                    alert('已登出！');
                }
            });
        });
        
        document.getElementById('submitBtn').addEventListener('click', () => {
            confirmModal.show({
                title: '提交確認',
                message: '您確定要提交此表單嗎？',
                type: 'default',
                confirmText: '提交',
                cancelText: '取消',
                onConfirm: () => {
                    alert('表單已提交！');
                }
            });
        });
    </script>
</body>
</html>
