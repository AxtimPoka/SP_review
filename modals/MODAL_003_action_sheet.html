<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODAL_003 - 操作選擇表單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#666666',
                        'text-tertiary': '#999999'
                    },
                    boxShadow: {
                        'level-4': '0px 8px 24px rgba(0,0,0,0.15)'
                    }
                }
            }
        }
    </script>
    <style>
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
        
        .sheet-enter {
            animation: slideUp 0.3s ease-out;
        }
        
        .sheet-exit {
            animation: slideDown 0.25s ease-in;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(100%);
            }
        }
        
        /* 手勢滑動指示器 */
        .drag-handle {
            width: 36px;
            height: 4px;
            background-color: #D1D5DB;
            border-radius: 2px;
        }
        
        /* 防止背景滾動 */
        .no-scroll {
            overflow: hidden;
        }
        
        /* 觸控友好的按鈕 */
        .action-button {
            min-height: 56px;
            touch-action: manipulation;
        }
        
        /* 危險操作按鈕 */
        .destructive {
            color: #FF4757;
        }
        
        /* 分隔線 */
        .separator {
            height: 8px;
            background-color: #F3F4F6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- 示例觸發按鈕 -->
    <div class="max-w-sm mx-auto space-y-4">
        <h1 class="text-2xl font-bold text-text-primary text-center mb-8">MODAL_003 - 操作選擇表單</h1>
        
        <div class="space-y-4">
            <button id="recordingOptionsBtn" class="w-full bg-primary text-white py-3 px-6 rounded-lg font-medium">
                錄音選項
            </button>
            
            <button id="caseActionsBtn" class="w-full bg-secondary text-white py-3 px-6 rounded-lg font-medium">
                CASE 操作
            </button>
            
            <button id="shareOptionsBtn" class="w-full bg-success text-white py-3 px-6 rounded-lg font-medium">
                分享選項
            </button>
            
            <button id="moreActionsBtn" class="w-full bg-warning text-white py-3 px-6 rounded-lg font-medium">
                更多操作
            </button>
        </div>
        
        <div class="mt-8 p-4 bg-white rounded-lg shadow">
            <h3 class="font-semibold text-text-primary mb-2">組件說明：</h3>
            <ul class="text-sm text-text-secondary space-y-1">
                <li>• iOS風格的底部操作表單</li>
                <li>• 支援向下滑動關閉手勢</li>
                <li>• 支援分組操作選項</li>
                <li>• 支援危險操作標記</li>
                <li>• 觸控友好的按鈕尺寸</li>
                <li>• 支援圖標和描述文字</li>
            </ul>
        </div>
    </div>

    <!-- 操作選擇表單模態框 -->
    <div id="actionSheet" class="fixed inset-0 z-50 hidden">
        <!-- 背景遮罩 -->
        <div class="modal-backdrop fixed inset-0 bg-black bg-opacity-50 transition-opacity duration-300"></div>
        
        <!-- 底部表單內容 -->
        <div class="fixed bottom-0 left-0 right-0 flex justify-center">
            <div class="sheet-enter bg-white rounded-t-xl shadow-level-4 w-full max-w-md mx-4 mb-4">
                <!-- 拖拽手柄 -->
                <div class="flex justify-center pt-3 pb-2">
                    <div class="drag-handle"></div>
                </div>
                
                <!-- 標題區域 -->
                <div id="sheetHeader" class="px-4 pb-2">
                    <h3 id="sheetTitle" class="text-lg font-semibold text-text-primary text-center">
                        選擇操作
                    </h3>
                    <p id="sheetSubtitle" class="text-sm text-text-tertiary text-center mt-1 hidden">
                        請選擇您要執行的操作
                    </p>
                </div>
                
                <!-- 操作選項列表 -->
                <div id="actionList" class="max-h-96 overflow-y-auto">
                    <!-- 動態插入操作選項 -->
                </div>
                
                <!-- 取消按鈕 -->
                <div class="separator"></div>
                <div class="p-4">
                    <button id="cancelActionBtn" class="action-button w-full bg-gray-100 text-text-secondary rounded-lg font-medium hover:bg-gray-200 transition-colors flex items-center justify-center">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 操作選擇表單類
        class ActionSheet {
            constructor() {
                this.modal = document.getElementById('actionSheet');
                this.sheetTitle = document.getElementById('sheetTitle');
                this.sheetSubtitle = document.getElementById('sheetSubtitle');
                this.actionList = document.getElementById('actionList');
                this.cancelBtn = document.getElementById('cancelActionBtn');
                this.backdrop = this.modal.querySelector('.modal-backdrop');
                this.sheetContent = this.modal.querySelector('.sheet-enter');
                
                this.onCancel = null;
                this.startY = 0;
                this.currentY = 0;
                this.isDragging = false;
                
                this.init();
            }
            
            init() {
                // ESC鍵關閉
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.modal.classList.contains('hidden')) {
                        this.hide();
                    }
                });
                
                // 背景點擊關閉
                this.backdrop.addEventListener('click', () => {
                    this.hide();
                });
                
                // 取消按鈕
                this.cancelBtn.addEventListener('click', () => {
                    this.hide();
                    if (this.onCancel) this.onCancel();
                });
                
                // 觸控手勢支援
                this.initTouchGestures();
            }
            
            initTouchGestures() {
                const dragHandle = this.sheetContent.querySelector('.drag-handle');
                
                // 觸控開始
                this.sheetContent.addEventListener('touchstart', (e) => {
                    this.startY = e.touches[0].clientY;
                    this.isDragging = true;
                });
                
                // 觸控移動
                this.sheetContent.addEventListener('touchmove', (e) => {
                    if (!this.isDragging) return;
                    
                    this.currentY = e.touches[0].clientY;
                    const deltaY = this.currentY - this.startY;
                    
                    // 只允許向下滑動
                    if (deltaY > 0) {
                        this.sheetContent.style.transform = `translateY(${deltaY}px)`;
                    }
                });
                
                // 觸控結束
                this.sheetContent.addEventListener('touchend', () => {
                    if (!this.isDragging) return;
                    
                    const deltaY = this.currentY - this.startY;
                    
                    // 如果滑動距離超過閾值，關閉表單
                    if (deltaY > 100) {
                        this.hide();
                    } else {
                        // 回彈到原位
                        this.sheetContent.style.transform = 'translateY(0)';
                        this.sheetContent.style.transition = 'transform 0.3s ease-out';
                        setTimeout(() => {
                            this.sheetContent.style.transition = '';
                        }, 300);
                    }
                    
                    this.isDragging = false;
                });
            }
            
            show(options = {}) {
                const {
                    title = '選擇操作',
                    subtitle = null,
                    actions = [],
                    onCancel = null
                } = options;
                
                // 設置標題
                this.sheetTitle.textContent = title;
                
                if (subtitle) {
                    this.sheetSubtitle.textContent = subtitle;
                    this.sheetSubtitle.classList.remove('hidden');
                } else {
                    this.sheetSubtitle.classList.add('hidden');
                }
                
                // 設置回調
                this.onCancel = onCancel;
                
                // 生成操作選項
                this.renderActions(actions);
                
                // 防止背景滾動
                document.body.classList.add('no-scroll');
                
                // 顯示模態框
                this.modal.classList.remove('hidden');
                this.sheetContent.classList.remove('sheet-exit');
                this.sheetContent.classList.add('sheet-enter');
            }
            
            hide() {
                this.sheetContent.classList.remove('sheet-enter');
                this.sheetContent.classList.add('sheet-exit');
                
                setTimeout(() => {
                    this.modal.classList.add('hidden');
                    document.body.classList.remove('no-scroll');
                    this.sheetContent.style.transform = '';
                }, 250);
            }
            
            renderActions(actions) {
                this.actionList.innerHTML = '';
                
                let currentGroup = null;
                
                actions.forEach((action, index) => {
                    // 檢查是否需要新的分組
                    if (action.group && action.group !== currentGroup) {
                        if (currentGroup !== null) {
                            // 添加分隔線
                            const separator = document.createElement('div');
                            separator.className = 'separator';
                            this.actionList.appendChild(separator);
                        }
                        currentGroup = action.group;
                    }
                    
                    // 創建操作按鈕
                    const button = this.createActionButton(action);
                    this.actionList.appendChild(button);
                });
            }
            
            createActionButton(action) {
                const button = document.createElement('button');
                button.className = `action-button w-full px-4 py-4 text-left hover:bg-gray-50 transition-colors flex items-center ${action.destructive ? 'destructive' : ''}`;
                
                let iconHtml = '';
                if (action.icon) {
                    iconHtml = `
                        <div class="w-6 h-6 mr-3 flex-shrink-0">
                            ${action.icon}
                        </div>
                    `;
                }
                
                button.innerHTML = `
                    ${iconHtml}
                    <div class="flex-1">
                        <div class="font-medium ${action.destructive ? 'text-error' : 'text-text-primary'}">${action.title}</div>
                        ${action.subtitle ? `<div class="text-sm text-text-tertiary mt-1">${action.subtitle}</div>` : ''}
                    </div>
                    ${action.badge ? `<div class="ml-2 px-2 py-1 bg-primary bg-opacity-10 text-primary text-xs rounded-full">${action.badge}</div>` : ''}
                `;
                
                button.addEventListener('click', () => {
                    this.hide();
                    if (action.handler) action.handler();
                });
                
                return button;
            }
        }
        
        // 初始化操作選擇表單
        const actionSheet = new ActionSheet();
        
        // 示例用法
        document.getElementById('recordingOptionsBtn').addEventListener('click', () => {
            actionSheet.show({
                title: '錄音選項',
                subtitle: '選擇錄音相關操作',
                actions: [
                    {
                        title: '開始新錄音',
                        subtitle: '創建新的錄音檔案',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path></svg>',
                        handler: () => alert('開始錄音')
                    },
                    {
                        title: '查看錄音歷史',
                        subtitle: '瀏覽所有錄音檔案',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>',
                        handler: () => alert('查看錄音歷史')
                    },
                    {
                        title: '錄音設定',
                        subtitle: '調整錄音品質和偏好',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>',
                        handler: () => alert('錄音設定')
                    }
                ]
            });
        });
        
        document.getElementById('caseActionsBtn').addEventListener('click', () => {
            actionSheet.show({
                title: 'CASE 操作',
                actions: [
                    {
                        title: '編輯 CASE',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg>',
                        handler: () => alert('編輯 CASE')
                    },
                    {
                        title: '標記為成交',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>',
                        badge: '新功能',
                        handler: () => alert('標記成交')
                    },
                    {
                        title: '分享 CASE',
                        subtitle: '與團隊成員分享',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"></path></svg>',
                        handler: () => alert('分享 CASE')
                    },
                    {
                        group: 'danger',
                        title: '刪除 CASE',
                        subtitle: '此操作無法復原',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd"></path><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>',
                        destructive: true,
                        handler: () => alert('刪除 CASE')
                    }
                ]
            });
        });
        
        document.getElementById('shareOptionsBtn').addEventListener('click', () => {
            actionSheet.show({
                title: '分享選項',
                subtitle: '選擇分享方式',
                actions: [
                    {
                        title: '複製連結',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z" clip-rule="evenodd"></path></svg>',
                        handler: () => alert('已複製連結')
                    },
                    {
                        title: '傳送訊息',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>',
                        handler: () => alert('傳送訊息')
                    },
                    {
                        title: '匯出報告',
                        subtitle: 'PDF 格式',
                        icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>',
                        handler: () => alert('匯出報告')
                    }
                ]
            });
        });
        
        document.getElementById('moreActionsBtn').addEventListener('click', () => {
            actionSheet.show({
                title: '更多操作',
                actions: [
                    {
                        title: '新增客戶',
                        handler: () => alert('新增客戶')
                    },
                    {
                        title: '掃描名片',
                        handler: () => alert('掃描名片')
                    },
                    {
                        title: '同步資料',
                        handler: () => alert('同步資料')
                    },
                    {
                        title: '意見回饋',
                        handler: () => alert('意見回饋')
                    },
                    {
                        title: '關於應用程式',
                        handler: () => alert('關於應用程式')
                    }
                ]
            });
        });
    </script>
</body>
</html>
