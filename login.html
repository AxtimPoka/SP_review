<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesAI - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'dark-gray': '#1A1A1A',
                        'medium-gray': '#666666',
                        'light-gray': '#999999',
                        'bg-gray': '#F8F9FA',
                        'border-gray': '#E5E5E5'
                    },
                    fontFamily: {
                        'sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Roboto', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-error': 'pulseError 0.5s ease-in-out',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        @keyframes pulseError {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46, 91, 255, 0.15);
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46, 91, 255, 0.25);
        }
        
        .btn-active:active {
            transform: translateY(0);
        }
        
        /* Custom checkbox styling */
        .custom-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #E5E5E5;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        
        .custom-checkbox:checked {
            background-color: #2E5BFF;
            border-color: #2E5BFF;
        }
        
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-bg-gray min-h-screen font-sans">
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50 hidden">
        <div class="flex flex-col items-center space-y-4">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            <p class="text-medium-gray text-sm">正在登入中...</p>
        </div>
    </div>

    <!-- Main container -->
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-sm mx-auto">
            <!-- Logo and header -->
            <div class="text-center mb-8 animate-fade-in">
                <div class="w-16 h-16 bg-primary rounded-2xl mx-auto mb-4 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7V17C2 17.55 2.45 18 3 18H21C21.55 18 22 17.55 22 17V7L12 2ZM12 4.5L19 8V16H5V8L12 4.5ZM8 10V14H10V12H14V14H16V10H14V12H10V10H8Z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-dark-gray mb-2">SalesAI</h1>
                <p class="text-medium-gray text-base">AI驅動銷售培訓系統</p>
            </div>

            <!-- Login form -->
            <form id="loginForm" class="space-y-6 animate-slide-up">
                <!-- Email input -->
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-medium text-dark-gray">
                        帳號或Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 12C14.21 12 16 10.21 16 8S14.21 4 12 4 8 5.79 8 8 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="email"
                            name="email"
                            class="input-focus w-full pl-10 pr-4 py-3 border border-border-gray rounded-lg text-base placeholder-light-gray focus:outline-none focus:border-primary transition-all duration-200"
                            placeholder="請輸入帳號或Email"
                            required
                        />
                    </div>
                    <p id="emailError" class="text-error text-sm mt-1 hidden"></p>
                </div>

                <!-- Password input -->
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-medium text-dark-gray">
                        密碼
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 17C10.89 17 10 16.1 10 15C10 13.89 10.89 13 12 13C13.11 13 14 13.89 14 15C14 16.1 13.11 17 12 17ZM18 8C19.1 8 20 8.9 20 10V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V10C4 8.9 4.9 8 6 8H7V6C7 3.24 9.24 1 12 1C14.76 1 17 3.24 17 6V8H18ZM12 3C10.34 3 9 4.34 9 6V8H15V6C15 4.34 13.66 3 12 3Z"/>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="input-focus w-full pl-10 pr-12 py-3 border border-border-gray rounded-lg text-base placeholder-light-gray focus:outline-none focus:border-primary transition-all duration-200"
                            placeholder="請輸入密碼"
                            required
                        />
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center"
                        >
                            <svg id="eyeOpen" class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5S21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12S9.24 7 12 7 17 9.24 17 12 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12S10.34 15 12 15 15 13.66 15 12 13.66 9 12 9Z"/>
                            </svg>
                            <svg id="eyeClosed" class="w-5 h-5 text-light-gray hidden" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 7C9.24 7 7 9.24 7 12C7 12.65 7.13 13.26 7.36 13.82L2.22 18.96C1.73 19.45 1.73 20.27 2.22 20.76C2.71 21.25 3.53 21.25 4.02 20.76L19.78 5C20.27 4.51 20.27 3.69 19.78 3.2C19.29 2.71 18.47 2.71 17.98 3.2L15.54 5.64C14.43 5.23 13.23 5 12 5C7 5 2.73 8.11 1 12.5C1.69 14.27 2.82 15.8 4.24 17.04L12 7Z"/>
                            </svg>
                        </button>
                    </div>
                    <p id="passwordError" class="text-error text-sm mt-1 hidden"></p>
                </div>

                <!-- Remember me checkbox -->
                <div class="flex items-center">
                    <input
                        type="checkbox"
                        id="rememberMe"
                        name="rememberMe"
                        class="custom-checkbox"
                    />
                    <label for="rememberMe" class="ml-3 text-sm text-medium-gray cursor-pointer">
                        記住登入狀態
                    </label>
                </div>

                <!-- Login button -->
                <button
                    type="submit"
                    id="loginButton"
                    class="btn-hover btn-active w-full bg-primary text-white py-3 px-4 rounded-lg text-base font-medium hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
                >
                    <span id="loginButtonText">登入</span>
                    <div id="loginButtonSpinner" class="hidden inline-flex items-center">
                        <svg class="w-4 h-4 mr-2 animate-spin" fill="currentColor" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12C4 16.418 7.582 20 12 20V18C8.686 18 6 15.314 6 12H4Z"></path>
                        </svg>
                        正在登入...
                    </div>
                </button>

                <!-- Forgot password link -->
                <div class="text-center">
                    <a href="forgot-password.html" class="text-primary text-sm font-medium hover:text-blue-700 transition-colors duration-200">
                        忘記密碼？
                    </a>
                </div>
            </form>

            <!-- Error message -->
            <div id="errorMessage" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg hidden animate-pulse-error">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-error mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M11 15H13V17H11V15ZM11 7H13V13H11V7ZM12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12S7.59 4 12 4 20 7.59 20 12 16.41 20 12 20Z"/>
                    </svg>
                    <p class="text-error text-sm font-medium" id="errorText"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        class LoginPage {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.emailInput = document.getElementById('email');
                this.passwordInput = document.getElementById('password');
                this.togglePasswordBtn = document.getElementById('togglePassword');
                this.rememberMeCheckbox = document.getElementById('rememberMe');
                this.loginButton = document.getElementById('loginButton');
                this.errorMessage = document.getElementById('errorMessage');
                this.loadingOverlay = document.getElementById('loadingOverlay');

                this.init();
            }

            init() {
                this.bindEvents();
                this.loadRememberedCredentials();
            }

            bindEvents() {
                // Form submission
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                
                // Password visibility toggle
                this.togglePasswordBtn.addEventListener('click', () => this.togglePassword());
                
                // Input validation on blur
                this.emailInput.addEventListener('blur', () => this.validateEmail());
                this.passwordInput.addEventListener('blur', () => this.validatePassword());
                
                // Clear errors on input
                this.emailInput.addEventListener('input', () => this.clearError('email'));
                this.passwordInput.addEventListener('input', () => this.clearError('password'));

                // Touch device enhancements
                if ('ontouchstart' in window) {
                    this.addTouchEnhancements();
                }
            }

            addTouchEnhancements() {
                // Add touch feedback for buttons
                const buttons = document.querySelectorAll('button, .btn-hover');
                buttons.forEach(button => {
                    button.addEventListener('touchstart', () => {
                        button.style.transform = 'scale(0.98)';
                    });
                    button.addEventListener('touchend', () => {
                        setTimeout(() => {
                            button.style.transform = '';
                        }, 100);
                    });
                });
            }

            validateEmail() {
                const email = this.emailInput.value.trim();
                const emailError = document.getElementById('emailError');
                
                if (!email) {
                    this.showFieldError('email', '請輸入帳號或Email');
                    return false;
                }
                
                // Simple email validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (email.includes('@') && !emailRegex.test(email)) {
                    this.showFieldError('email', 'Email格式不正確');
                    return false;
                }
                
                this.clearError('email');
                return true;
            }

            validatePassword() {
                const password = this.passwordInput.value;
                
                if (!password) {
                    this.showFieldError('password', '請輸入密碼');
                    return false;
                }
                
                if (password.length < 6) {
                    this.showFieldError('password', '密碼至少需要6個字元');
                    return false;
                }
                
                this.clearError('password');
                return true;
            }

            showFieldError(field, message) {
                const input = document.getElementById(field);
                const errorElement = document.getElementById(`${field}Error`);
                
                input.classList.add('border-error', 'animate-pulse-error');
                input.classList.remove('border-border-gray');
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
                
                // Remove animation class after animation completes
                setTimeout(() => {
                    input.classList.remove('animate-pulse-error');
                }, 500);
            }

            clearError(field) {
                const input = document.getElementById(field);
                const errorElement = document.getElementById(`${field}Error`);
                
                input.classList.remove('border-error');
                input.classList.add('border-border-gray');
                errorElement.classList.add('hidden');
                
                // Hide general error message
                this.errorMessage.classList.add('hidden');
            }

            togglePassword() {
                const eyeOpen = document.getElementById('eyeOpen');
                const eyeClosed = document.getElementById('eyeClosed');
                
                if (this.passwordInput.type === 'password') {
                    this.passwordInput.type = 'text';
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                } else {
                    this.passwordInput.type = 'password';
                    eyeOpen.classList.remove('hidden');
                    eyeClosed.classList.add('hidden');
                }
            }

            async handleSubmit(e) {
                e.preventDefault();
                
                // Validate all fields
                const isEmailValid = this.validateEmail();
                const isPasswordValid = this.validatePassword();
                
                if (!isEmailValid || !isPasswordValid) {
                    return;
                }
                
                // Show loading state
                this.setLoadingState(true);
                
                try {
                    // Simulate API call
                    await this.simulateLogin();
                    
                    // Save credentials if remember me is checked
                    if (this.rememberMeCheckbox.checked) {
                        this.saveCredentials();
                    } else {
                        this.clearSavedCredentials();
                    }
                    
                    // Simulate role detection and redirect
                    this.handleLoginSuccess();
                    
                } catch (error) {
                    this.showGeneralError(error.message);
                } finally {
                    this.setLoadingState(false);
                }
            }

            async simulateLogin() {
                // Simulate network delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const email = this.emailInput.value.trim();
                const password = this.passwordInput.value;
                
                // Simulate login logic
                if (email === 'admin@salesai.com' && password === 'admin123') {
                    // Manager role
                    return { role: 'manager', hasMultipleRoles: true };
                } else if (email === 'sales@salesai.com' && password === 'sales123') {
                    // Sales role
                    return { role: 'sales', hasMultipleRoles: false };
                } else if (email && password) {
                    // Default success for demo
                    return { role: 'sales', hasMultipleRoles: false };
                } else {
                    throw new Error('帳號或密碼錯誤');
                }
            }

            handleLoginSuccess() {
                // Show success feedback
                this.showSuccessFeedback();
                
                // Simulate role detection delay
                setTimeout(() => {
                    // For demo purposes, randomly assign roles
                    const isManager = Math.random() > 0.7; // 30% chance of being manager
                    const hasMultipleRoles = isManager && Math.random() > 0.5;
                    
                    if (hasMultipleRoles) {
                        window.location.href = 'role-selection.html';
                    } else if (isManager) {
                        // Redirect to manager dashboard (not implemented in this demo)
                        alert('成功登入！將導向主管儀表板');
                    } else {
                        // Redirect to sales dashboard (not implemented in this demo)  
                        alert('成功登入！將導向銷售人員主頁');
                    }
                }, 1000);
            }

            showSuccessFeedback() {
                // Change button to success state
                const buttonText = document.getElementById('loginButtonText');
                const buttonSpinner = document.getElementById('loginButtonSpinner');
                
                buttonSpinner.classList.add('hidden');
                buttonText.textContent = '登入成功！';
                this.loginButton.classList.remove('bg-primary', 'hover:bg-blue-700');
                this.loginButton.classList.add('bg-success');
                
                // Add success icon
                buttonText.innerHTML = '✓ 登入成功！';
            }

            setLoadingState(loading) {
                const buttonText = document.getElementById('loginButtonText');
                const buttonSpinner = document.getElementById('loginButtonSpinner');
                
                if (loading) {
                    buttonText.classList.add('hidden');
                    buttonSpinner.classList.remove('hidden');
                    this.loginButton.disabled = true;
                    this.loadingOverlay.classList.remove('hidden');
                } else {
                    buttonText.classList.remove('hidden');
                    buttonSpinner.classList.add('hidden');
                    this.loginButton.disabled = false;
                    this.loadingOverlay.classList.add('hidden');
                }
            }

            showGeneralError(message) {
                const errorText = document.getElementById('errorText');
                errorText.textContent = message;
                this.errorMessage.classList.remove('hidden');
                
                // Scroll to error message on mobile
                if (window.innerWidth < 768) {
                    this.errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            saveCredentials() {
                if (typeof(Storage) !== "undefined") {
                    localStorage.setItem('salesai_remember_email', this.emailInput.value.trim());
                    localStorage.setItem('salesai_remember_me', 'true');
                }
            }

            loadRememberedCredentials() {
                if (typeof(Storage) !== "undefined") {
                    const rememberedEmail = localStorage.getItem('salesai_remember_email');
                    const rememberMe = localStorage.getItem('salesai_remember_me');
                    
                    if (rememberMe === 'true' && rememberedEmail) {
                        this.emailInput.value = rememberedEmail;
                        this.rememberMeCheckbox.checked = true;
                    }
                }
            }

            clearSavedCredentials() {
                if (typeof(Storage) !== "undefined") {
                    localStorage.removeItem('salesai_remember_email');
                    localStorage.removeItem('salesai_remember_me');
                }
            }
        }

        // Initialize the login page when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LoginPage();
        });

        // Service Worker registration for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
