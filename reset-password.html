<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesAI - 重設密碼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'dark-gray': '#1A1A1A',
                        'medium-gray': '#666666',
                        'light-gray': '#999999',
                        'bg-gray': '#F8F9FA',
                        'border-gray': '#E5E5E5'
                    },
                    fontFamily: {
                        'sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Roboto', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-error': 'pulseError 0.5s ease-in-out',
                        'bounce-in': 'bounceIn 0.6s ease-out',
                        'progress-fill': 'progressFill 0.3s ease-out',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        @keyframes pulseError {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes progressFill {
            from { width: 0%; }
            to { width: var(--target-width); }
        }
        
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46, 91, 255, 0.15);
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46, 91, 255, 0.25);
        }
        
        .btn-active:active {
            transform: translateY(0);
        }
        
        .password-strength-bar {
            transition: all 0.3s ease;
        }
        
        .password-strength-weak {
            background-color: #FF4757;
            --target-width: 25%;
        }
        
        .password-strength-fair {
            background-color: #FFB800;
            --target-width: 50%;
        }
        
        .password-strength-good {
            background-color: #00C6AE;
            --target-width: 75%;
        }
        
        .password-strength-strong {
            background-color: #00D563;
            --target-width: 100%;
        }
        
        .requirement-item {
            transition: all 0.2s ease;
        }
        
        .requirement-met {
            color: #00D563;
        }
        
        .requirement-unmet {
            color: #999999;
        }
        
        .success-checkmark {
            animation: bounceIn 0.6s ease-out;
        }
    </style>
</head>
<body class="bg-bg-gray min-h-screen font-sans">
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50 hidden">
        <div class="flex flex-col items-center space-y-4">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            <p class="text-medium-gray text-sm">正在重設密碼...</p>
        </div>
    </div>

    <!-- Main container -->
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-sm mx-auto">
            <!-- Header -->
            <div class="text-center mb-8 animate-fade-in">
                <div class="w-16 h-16 bg-primary rounded-2xl mx-auto mb-4 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 17C10.89 17 10 16.1 10 15C10 13.89 10.89 13 12 13C13.11 13 14 13.89 14 15C14 16.1 13.11 17 12 17ZM18 8C19.1 8 20 8.9 20 10V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V10C4 8.9 4.9 8 6 8H7V6C7 3.24 9.24 1 12 1C14.76 1 17 3.24 17 6V8H18ZM12 3C10.34 3 9 4.34 9 6V8H15V6C15 4.34 13.66 3 12 3Z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-dark-gray mb-2">設定新密碼</h1>
                <p class="text-medium-gray text-sm leading-6">
                    請為您的帳號設定一個安全的新密碼
                </p>
            </div>

            <!-- Reset password form -->
            <div id="resetPasswordForm" class="animate-slide-up">
                <form id="passwordForm" class="space-y-6">
                    <!-- New password input -->
                    <div class="space-y-2">
                        <label for="newPassword" class="block text-sm font-medium text-dark-gray">
                            新密碼
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 17C10.89 17 10 16.1 10 15C10 13.89 10.89 13 12 13C13.11 13 14 13.89 14 15C14 16.1 13.11 17 12 17ZM18 8C19.1 8 20 8.9 20 10V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V10C4 8.9 4.9 8 6 8H7V6C7 3.24 9.24 1 12 1C14.76 1 17 3.24 17 6V8H18ZM12 3C10.34 3 9 4.34 9 6V8H15V6C15 4.34 13.66 3 12 3Z"/>
                                </svg>
                            </div>
                            <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                class="input-focus w-full pl-10 pr-12 py-3 border border-border-gray rounded-lg text-base placeholder-light-gray focus:outline-none focus:border-primary transition-all duration-200"
                                placeholder="請輸入新密碼"
                                required
                            />
                            <button
                                type="button"
                                id="toggleNewPassword"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center"
                            >
                                <svg id="newPasswordEyeOpen" class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5S21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12S9.24 7 12 7 17 9.24 17 12 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12S10.34 15 12 15 15 13.66 15 12 13.66 9 12 9Z"/>
                                </svg>
                                <svg id="newPasswordEyeClosed" class="w-5 h-5 text-light-gray hidden" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 7C9.24 7 7 9.24 7 12C7 12.65 7.13 13.26 7.36 13.82L2.22 18.96C1.73 19.45 1.73 20.27 2.22 20.76C2.71 21.25 3.53 21.25 4.02 20.76L19.78 5C20.27 4.51 20.27 3.69 19.78 3.2C19.29 2.71 18.47 2.71 17.98 3.2L15.54 5.64C14.43 5.23 13.23 5 12 5C7 5 2.73 8.11 1 12.5C1.69 14.27 2.82 15.8 4.24 17.04L12 7Z"/>
                                </svg>
                            </button>
                        </div>
                        <p id="newPasswordError" class="text-error text-sm mt-1 hidden"></p>
                        
                        <!-- Password strength indicator -->
                        <div class="mt-3">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-medium text-medium-gray">密碼強度</span>
                                <span id="strengthText" class="text-xs font-medium text-light-gray">請輸入密碼</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="strengthBar" class="password-strength-bar h-2 rounded-full animate-progress-fill" style="width: 0%"></div>
                            </div>
                        </div>

                        <!-- Password requirements -->
                        <div class="mt-4 space-y-2">
                            <p class="text-xs font-medium text-medium-gray">密碼要求：</p>
                            <ul class="space-y-1 text-xs">
                                <li id="req-length" class="requirement-item requirement-unmet flex items-center">
                                    <svg class="w-3 h-3 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                                    </svg>
                                    至少 8 個字元
                                </li>
                                <li id="req-upper" class="requirement-item requirement-unmet flex items-center">
                                    <svg class="w-3 h-3 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                                    </svg>
                                    包含大寫字母
                                </li>
                                <li id="req-lower" class="requirement-item requirement-unmet flex items-center">
                                    <svg class="w-3 h-3 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                                    </svg>
                                    包含小寫字母
                                </li>
                                <li id="req-number" class="requirement-item requirement-unmet flex items-center">
                                    <svg class="w-3 h-3 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                                    </svg>
                                    包含數字
                                </li>
                                <li id="req-special" class="requirement-item requirement-unmet flex items-center">
                                    <svg class="w-3 h-3 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                                    </svg>
                                    包含特殊字符 (!@#$%^&*)
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- Confirm password input -->
                    <div class="space-y-2">
                        <label for="confirmPassword" class="block text-sm font-medium text-dark-gray">
                            確認新密碼
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/>
                                </svg>
                            </div>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="input-focus w-full pl-10 pr-12 py-3 border border-border-gray rounded-lg text-base placeholder-light-gray focus:outline-none focus:border-primary transition-all duration-200"
                                placeholder="請再次輸入新密碼"
                                required
                            />
                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center"
                            >
                                <svg id="confirmPasswordEyeOpen" class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5S21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12S9.24 7 12 7 17 9.24 17 12 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12S10.34 15 12 15 15 13.66 15 12 13.66 9 12 9Z"/>
                                </svg>
                                <svg id="confirmPasswordEyeClosed" class="w-5 h-5 text-light-gray hidden" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 7C9.24 7 7 9.24 7 12C7 12.65 7.13 13.26 7.36 13.82L2.22 18.96C1.73 19.45 1.73 20.27 2.22 20.76C2.71 21.25 3.53 21.25 4.02 20.76L19.78 5C20.27 4.51 20.27 3.69 19.78 3.2C19.29 2.71 18.47 2.71 17.98 3.2L15.54 5.64C14.43 5.23 13.23 5 12 5C7 5 2.73 8.11 1 12.5C1.69 14.27 2.82 15.8 4.24 17.04L12 7Z"/>
                                </svg>
                            </button>
                        </div>
                        <p id="confirmPasswordError" class="text-error text-sm mt-1 hidden"></p>
                    </div>

                    <!-- Reset password button -->
                    <button
                        type="submit"
                        id="resetButton"
                        class="btn-hover btn-active w-full bg-primary text-white py-3 px-4 rounded-lg text-base font-medium hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
                        disabled
                    >
                        <span id="resetButtonText">重設密碼</span>
                        <div id="resetButtonSpinner" class="hidden inline-flex items-center">
                            <svg class="w-4 h-4 mr-2 animate-spin" fill="currentColor" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12C4 16.418 7.582 20 12 20V18C8.686 18 6 15.314 6 12H4Z"></path>
                            </svg>
                            正在重設...
                        </div>
                    </button>
                </form>
            </div>

            <!-- Success state -->
            <div id="successState" class="hidden animate-bounce-in">
                <div class="text-center space-y-6">
                    <!-- Success icon -->
                    <div class="w-20 h-20 bg-success rounded-full mx-auto flex items-center justify-center success-checkmark">
                        <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                        </svg>
                    </div>

                    <!-- Success message -->
                    <div class="space-y-3">
                        <h2 class="text-xl font-bold text-dark-gray">密碼重設成功！</h2>
                        <p class="text-medium-gray text-sm leading-6">
                            您的密碼已成功更新。<br>
                            現在可以使用新密碼登入您的帳號。
                        </p>
                    </div>

                    <!-- Action button -->
                    <div class="space-y-3">
                        <a href="login.html" class="block w-full bg-primary text-white py-3 px-4 rounded-lg text-base font-medium hover:bg-blue-700 text-center transition-all duration-200">
                            返回登入頁面
                        </a>
                    </div>
                </div>
            </div>

            <!-- Error message -->
            <div id="errorMessage" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg hidden animate-pulse-error">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-error mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M11 15H13V17H11V15ZM11 7H13V13H11V7ZM12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12S7.59 4 12 4 20 7.59 20 12 16.41 20 12 20Z"/>
                    </svg>
                    <p class="text-error text-sm font-medium" id="errorText"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        class ResetPasswordPage {
            constructor() {
                this.form = document.getElementById('passwordForm');
                this.newPasswordInput = document.getElementById('newPassword');
                this.confirmPasswordInput = document.getElementById('confirmPassword');
                this.resetButton = document.getElementById('resetButton');
                this.errorMessage = document.getElementById('errorMessage');
                this.loadingOverlay = document.getElementById('loadingOverlay');
                this.resetPasswordForm = document.getElementById('resetPasswordForm');
                this.successState = document.getElementById('successState');
                this.strengthBar = document.getElementById('strengthBar');
                this.strengthText = document.getElementById('strengthText');

                // Password requirements elements
                this.requirements = {
                    length: document.getElementById('req-length'),
                    upper: document.getElementById('req-upper'),
                    lower: document.getElementById('req-lower'),
                    number: document.getElementById('req-number'),
                    special: document.getElementById('req-special')
                };

                this.passwordStrength = 0;
                this.init();
            }

            init() {
                this.bindEvents();
                this.checkUrlToken();
            }

            bindEvents() {
                // Form submission
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                
                // Password toggle buttons
                document.getElementById('toggleNewPassword').addEventListener('click', () => {
                    this.togglePasswordVisibility('newPassword', 'newPasswordEyeOpen', 'newPasswordEyeClosed');
                });
                
                document.getElementById('toggleConfirmPassword').addEventListener('click', () => {
                    this.togglePasswordVisibility('confirmPassword', 'confirmPasswordEyeOpen', 'confirmPasswordEyeClosed');
                });
                
                // Password validation
                this.newPasswordInput.addEventListener('input', () => {
                    this.validatePassword();
                    this.updateResetButtonState();
                });
                
                this.confirmPasswordInput.addEventListener('input', () => {
                    this.validateConfirmPassword();
                    this.updateResetButtonState();
                });
                
                this.newPasswordInput.addEventListener('blur', () => this.validatePassword());
                this.confirmPasswordInput.addEventListener('blur', () => this.validateConfirmPassword());

                // Touch device enhancements
                if ('ontouchstart' in window) {
                    this.addTouchEnhancements();
                }
            }

            addTouchEnhancements() {
                const buttons = document.querySelectorAll('button, .btn-hover');
                buttons.forEach(button => {
                    button.addEventListener('touchstart', () => {
                        if (!button.disabled) {
                            button.style.transform = 'scale(0.98)';
                        }
                    });
                    button.addEventListener('touchend', () => {
                        setTimeout(() => {
                            button.style.transform = '';
                        }, 100);
                    });
                });
            }

            togglePasswordVisibility(inputId, eyeOpenId, eyeClosedId) {
                const input = document.getElementById(inputId);
                const eyeOpen = document.getElementById(eyeOpenId);
                const eyeClosed = document.getElementById(eyeClosedId);
                
                if (input.type === 'password') {
                    input.type = 'text';
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                } else {
                    input.type = 'password';
                    eyeOpen.classList.remove('hidden');
                    eyeClosed.classList.add('hidden');
                }
            }

            validatePassword() {
                const password = this.newPasswordInput.value;
                const requirements = {
                    length: password.length >= 8,
                    upper: /[A-Z]/.test(password),
                    lower: /[a-z]/.test(password),
                    number: /\d/.test(password),
                    special: /[!@#$%^&*]/.test(password)
                };

                // Update requirement indicators
                Object.keys(requirements).forEach(req => {
                    const element = this.requirements[req];
                    if (requirements[req]) {
                        element.classList.remove('requirement-unmet');
                        element.classList.add('requirement-met');
                    } else {
                        element.classList.remove('requirement-met');
                        element.classList.add('requirement-unmet');
                    }
                });

                // Calculate password strength
                const metRequirements = Object.values(requirements).filter(Boolean).length;
                this.passwordStrength = metRequirements;

                this.updatePasswordStrength(metRequirements);
                this.clearFieldError('newPassword');

                return Object.values(requirements).every(Boolean);
            }

            updatePasswordStrength(score) {
                const strengthBar = this.strengthBar;
                const strengthText = this.strengthText;
                
                strengthBar.classList.remove(
                    'password-strength-weak',
                    'password-strength-fair', 
                    'password-strength-good',
                    'password-strength-strong'
                );

                if (score === 0) {
                    strengthText.textContent = '請輸入密碼';
                    strengthText.className = 'text-xs font-medium text-light-gray';
                    strengthBar.style.width = '0%';
                } else if (score <= 2) {
                    strengthText.textContent = '弱';
                    strengthText.className = 'text-xs font-medium text-error';
                    strengthBar.classList.add('password-strength-weak');
                } else if (score <= 3) {
                    strengthText.textContent = '普通';
                    strengthText.className = 'text-xs font-medium text-warning';
                    strengthBar.classList.add('password-strength-fair');
                } else if (score <= 4) {
                    strengthText.textContent = '良好';
                    strengthText.className = 'text-xs font-medium text-secondary';
                    strengthBar.classList.add('password-strength-good');
                } else {
                    strengthText.textContent = '強';
                    strengthText.className = 'text-xs font-medium text-success';
                    strengthBar.classList.add('password-strength-strong');
                }
            }

            validateConfirmPassword() {
                const password = this.newPasswordInput.value;
                const confirmPassword = this.confirmPasswordInput.value;
                
                if (!confirmPassword) {
                    this.showFieldError('confirmPassword', '請確認您的密碼');
                    return false;
                }
                
                if (password !== confirmPassword) {
                    this.showFieldError('confirmPassword', '兩次輸入的密碼不一致');
                    return false;
                }
                
                this.clearFieldError('confirmPassword');
                return true;
            }

            updateResetButtonState() {
                const isPasswordValid = this.passwordStrength >= 4;
                const isConfirmValid = this.newPasswordInput.value === this.confirmPasswordInput.value && 
                                     this.confirmPasswordInput.value.length > 0;
                
                this.resetButton.disabled = !(isPasswordValid && isConfirmValid);
            }

            showFieldError(field, message) {
                const input = document.getElementById(field);
                const errorElement = document.getElementById(`${field}Error`);
                
                input.classList.add('border-error', 'animate-pulse-error');
                input.classList.remove('border-border-gray');
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
                
                setTimeout(() => {
                    input.classList.remove('animate-pulse-error');
                }, 500);
            }

            clearFieldError(field) {
                const input = document.getElementById(field);
                const errorElement = document.getElementById(`${field}Error`);
                
                input.classList.remove('border-error');
                input.classList.add('border-border-gray');
                errorElement.classList.add('hidden');
                this.errorMessage.classList.add('hidden');
            }

            async handleSubmit(e) {
                e.preventDefault();
                
                if (!this.validatePassword() || !this.validateConfirmPassword()) {
                    return;
                }
                
                this.setLoadingState(true);
                
                try {
                    await this.resetPassword();
                    this.showSuccessState();
                } catch (error) {
                    this.showGeneralError(error.message);
                } finally {
                    this.setLoadingState(false);
                }
            }

            async resetPassword() {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 2500));
                
                const newPassword = this.newPasswordInput.value;
                
                // Simulate validation on server side
                if (newPassword.includes('password123')) {
                    throw new Error('密碼太過常見，請選擇更安全的密碼');
                }
                
                // Default success scenario
                return { success: true };
            }

            showSuccessState() {
                // Animate transition
                this.resetPasswordForm.style.transform = 'translateY(-20px)';
                this.resetPasswordForm.style.opacity = '0';
                
                setTimeout(() => {
                    this.resetPasswordForm.classList.add('hidden');
                    this.successState.classList.remove('hidden');
                    this.successState.style.transform = 'translateY(20px)';
                    this.successState.style.opacity = '0';
                    
                    setTimeout(() => {
                        this.successState.style.transform = 'translateY(0)';
                        this.successState.style.opacity = '1';
                    }, 50);
                }, 300);
            }

            setLoadingState(loading) {
                const buttonText = document.getElementById('resetButtonText');
                const buttonSpinner = document.getElementById('resetButtonSpinner');
                
                if (loading) {
                    buttonText.classList.add('hidden');
                    buttonSpinner.classList.remove('hidden');
                    this.resetButton.disabled = true;
                    this.loadingOverlay.classList.remove('hidden');
                } else {
                    buttonText.classList.remove('hidden');
                    buttonSpinner.classList.add('hidden');
                    this.loadingOverlay.classList.add('hidden');
                }
            }

            showGeneralError(message) {
                const errorText = document.getElementById('errorText');
                errorText.textContent = message;
                this.errorMessage.classList.remove('hidden');
                
                if (window.innerWidth < 768) {
                    this.errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            checkUrlToken() {
                // In a real application, you would validate the reset token from the URL
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                
                if (!token) {
                    // Simulate expired or invalid token
                    setTimeout(() => {
                        this.showGeneralError('重設連結已過期或無效，請重新申請密碼重設');
                        this.resetButton.disabled = true;
                    }, 1000);
                }
            }
        }

        // Initialize the reset password page when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ResetPasswordPage();
        });

        // Add keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const errorMessage = document.getElementById('errorMessage');
                if (!errorMessage.classList.contains('hidden')) {
                    errorMessage.classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
