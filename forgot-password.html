<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesAI - 忘記密碼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE',
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'dark-gray': '#1A1A1A',
                        'medium-gray': '#666666',
                        'light-gray': '#999999',
                        'bg-gray': '#F8F9FA',
                        'border-gray': '#E5E5E5'
                    },
                    fontFamily: {
                        'sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Roboto', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.4s ease-out',
                        'pulse-error': 'pulseError 0.5s ease-in-out',
                        'bounce-in': 'bounceIn 0.6s ease-out',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        @keyframes slideDown {
            from { 
                opacity: 0; 
                transform: translateY(-20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        @keyframes pulseError {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46, 91, 255, 0.15);
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(46, 91, 255, 0.25);
        }
        
        .btn-active:active {
            transform: translateY(0);
        }
        
        .success-checkmark {
            animation: bounceIn 0.6s ease-out;
        }
    </style>
</head>
<body class="bg-bg-gray min-h-screen font-sans">
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50 hidden">
        <div class="flex flex-col items-center space-y-4">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            <p class="text-medium-gray text-sm">正在發送重設連結...</p>
        </div>
    </div>

    <!-- Main container -->
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-sm mx-auto">
            <!-- Back button -->
            <div class="mb-6 animate-fade-in">
                <a href="index.html" class="inline-flex items-center text-medium-gray hover:text-primary transition-colors duration-200">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6L8 12L14 18L15.41 16.59L10.83 12Z"/>
                    </svg>
                    <span class="text-sm font-medium">返回登入</span>
                </a>
            </div>

            <!-- Header -->
            <div class="text-center mb-8 animate-slide-up">
                <div class="w-16 h-16 bg-warning rounded-2xl mx-auto mb-4 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 5.5C14.8 5.5 14.6 5.4 14.5 5.1L13.5 3.5C13.1 2.8 12.2 2.5 11.5 3L6 5.6C5.7 5.8 5.5 6.1 5.5 6.5V9.5C5.5 10.1 6 10.5 6.5 10.5S7.5 10.1 7.5 9.5V7.8L9.5 7V15H7.5V11.5C7.5 10.9 7.1 10.5 6.5 10.5S5.5 10.9 5.5 11.5V16.5C5.5 17.3 6.2 18 7 18H17C17.8 18 18.5 17.3 18.5 16.5V9H21Z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-dark-gray mb-2">忘記密碼？</h1>
                <p class="text-medium-gray text-sm leading-6">
                    不用擔心！請輸入您的帳號或電子郵件地址，<br>
                    我們將發送重設密碼的連結給您。
                </p>
            </div>

            <!-- Forgot password form -->
            <div id="forgotPasswordForm" class="animate-slide-up">
                <form id="resetForm" class="space-y-6">
                    <!-- Email input -->
                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-medium text-dark-gray">
                            帳號或電子郵件
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-light-gray" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z"/>
                                </svg>
                            </div>
                            <input
                                type="text"
                                id="email"
                                name="email"
                                class="input-focus w-full pl-10 pr-4 py-3 border border-border-gray rounded-lg text-base placeholder-light-gray focus:outline-none focus:border-primary transition-all duration-200"
                                placeholder="請輸入帳號或電子郵件"
                                required
                            />
                        </div>
                        <p id="emailError" class="text-error text-sm mt-1 hidden"></p>
                    </div>

                    <!-- Send reset link button -->
                    <button
                        type="submit"
                        id="sendButton"
                        class="btn-hover btn-active w-full bg-primary text-white py-3 px-4 rounded-lg text-base font-medium hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
                    >
                        <span id="sendButtonText">發送重設連結</span>
                        <div id="sendButtonSpinner" class="hidden inline-flex items-center">
                            <svg class="w-4 h-4 mr-2 animate-spin" fill="currentColor" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12C4 16.418 7.582 20 12 20V18C8.686 18 6 15.314 6 12H4Z"></path>
                            </svg>
                            正在發送...
                        </div>
                    </button>
                </form>

                <!-- Helpful links -->
                <div class="mt-6 text-center space-y-3">
                    <p class="text-light-gray text-sm">或者</p>
                    <a href="index.html" class="block text-primary text-sm font-medium hover:text-blue-700 transition-colors duration-200">
                        返回登入頁面
                    </a>
                </div>
            </div>

            <!-- Success state -->
            <div id="successState" class="hidden animate-bounce-in">
                <div class="text-center space-y-6">
                    <!-- Success icon -->
                    <div class="w-20 h-20 bg-success rounded-full mx-auto flex items-center justify-center success-checkmark">
                        <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12L3.41 13.41L9 19L21 7L19.59 5.59Z"/>
                        </svg>
                    </div>

                    <!-- Success message -->
                    <div class="space-y-3">
                        <h2 class="text-xl font-bold text-dark-gray">重設連結已發送！</h2>
                        <p class="text-medium-gray text-sm leading-6">
                            我們已將密碼重設連結發送到您的電子郵件：<br>
                            <span id="sentEmail" class="font-medium text-dark-gray"></span>
                        </p>
                        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-4">
                            <div class="flex items-start space-x-3">
                                <svg class="w-5 h-5 text-primary mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM11 17H13V15H11V17ZM13 13V7H11V13H13Z"/>
                                </svg>
                                <div class="text-left">
                                    <p class="text-sm text-primary font-medium mb-1">請檢查您的郵件</p>
                                    <p class="text-xs text-medium-gray leading-5">
                                        點擊郵件中的連結來重設您的密碼。<br>
                                        如果您沒有收到郵件，請檢查垃圾郵件資料夾。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action buttons -->
                    <div class="space-y-3">
                        <button
                            id="resendButton"
                            class="w-full bg-white border-2 border-primary text-primary py-3 px-4 rounded-lg text-base font-medium hover:bg-blue-50 transition-all duration-200 disabled:opacity-50"
                            disabled
                        >
                            <span id="resendText">重新發送 (<span id="countdown">60</span>s)</span>
                        </button>
                        <a href="index.html" class="block w-full text-center text-medium-gray text-sm hover:text-primary transition-colors duration-200">
                            返回登入頁面
                        </a>
                    </div>
                </div>
            </div>

            <!-- Error message -->
            <div id="errorMessage" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg hidden animate-pulse-error">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-error mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M11 15H13V17H11V15ZM11 7H13V13H11V7ZM12 2C6.48 2 2 6.48 2 12S6.48 22 12 22 22 17.52 22 12 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12S7.59 4 12 4 20 7.59 20 12 16.41 20 12 20Z"/>
                    </svg>
                    <p class="text-error text-sm font-medium" id="errorText"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        class ForgotPasswordPage {
            constructor() {
                this.form = document.getElementById('resetForm');
                this.emailInput = document.getElementById('email');
                this.sendButton = document.getElementById('sendButton');
                this.errorMessage = document.getElementById('errorMessage');
                this.loadingOverlay = document.getElementById('loadingOverlay');
                this.forgotPasswordForm = document.getElementById('forgotPasswordForm');
                this.successState = document.getElementById('successState');
                this.resendButton = document.getElementById('resendButton');
                this.countdownElement = document.getElementById('countdown');
                
                this.countdownTimer = null;
                this.countdownSeconds = 60;

                this.init();
            }

            init() {
                this.bindEvents();
                this.loadFromHistory();
            }

            bindEvents() {
                // Form submission
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                
                // Input validation on blur
                this.emailInput.addEventListener('blur', () => this.validateEmail());
                
                // Clear errors on input
                this.emailInput.addEventListener('input', () => this.clearError());

                // Resend button
                this.resendButton.addEventListener('click', () => this.handleResend());

                // Touch device enhancements
                if ('ontouchstart' in window) {
                    this.addTouchEnhancements();
                }
            }

            addTouchEnhancements() {
                const buttons = document.querySelectorAll('button, .btn-hover');
                buttons.forEach(button => {
                    button.addEventListener('touchstart', () => {
                        if (!button.disabled) {
                            button.style.transform = 'scale(0.98)';
                        }
                    });
                    button.addEventListener('touchend', () => {
                        setTimeout(() => {
                            button.style.transform = '';
                        }, 100);
                    });
                });
            }

            validateEmail() {
                const email = this.emailInput.value.trim();
                const emailError = document.getElementById('emailError');
                
                if (!email) {
                    this.showFieldError('請輸入帳號或電子郵件');
                    return false;
                }
                
                // If input contains @, validate as email
                if (email.includes('@')) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        this.showFieldError('請輸入正確的電子郵件格式');
                        return false;
                    }
                }
                
                this.clearError();
                return true;
            }

            showFieldError(message) {
                const emailError = document.getElementById('emailError');
                
                this.emailInput.classList.add('border-error', 'animate-pulse-error');
                this.emailInput.classList.remove('border-border-gray');
                emailError.textContent = message;
                emailError.classList.remove('hidden');
                
                setTimeout(() => {
                    this.emailInput.classList.remove('animate-pulse-error');
                }, 500);
            }

            clearError() {
                const emailError = document.getElementById('emailError');
                
                this.emailInput.classList.remove('border-error');
                this.emailInput.classList.add('border-border-gray');
                emailError.classList.add('hidden');
                this.errorMessage.classList.add('hidden');
            }

            async handleSubmit(e) {
                e.preventDefault();
                
                if (!this.validateEmail()) {
                    return;
                }
                
                this.setLoadingState(true);
                
                try {
                    await this.sendResetLink();
                    this.showSuccessState();
                    this.startCountdown();
                } catch (error) {
                    this.showGeneralError(error.message);
                } finally {
                    this.setLoadingState(false);
                }
            }

            async sendResetLink() {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                const email = this.emailInput.value.trim();
                
                // Simulate different scenarios
                if (email === 'notfound@example.com') {
                    throw new Error('此帳號不存在，請確認您輸入的資訊是否正確');
                }
                
                if (email === 'blocked@example.com') {
                    throw new Error('此帳號已被停用，請聯繫系統管理員');
                }
                
                // Default success scenario
                return { success: true, email: email };
            }

            showSuccessState() {
                const email = this.emailInput.value.trim();
                document.getElementById('sentEmail').textContent = email;
                
                // Animate transition
                this.forgotPasswordForm.style.transform = 'translateY(-20px)';
                this.forgotPasswordForm.style.opacity = '0';
                
                setTimeout(() => {
                    this.forgotPasswordForm.classList.add('hidden');
                    this.successState.classList.remove('hidden');
                    this.successState.style.transform = 'translateY(20px)';
                    this.successState.style.opacity = '0';
                    
                    setTimeout(() => {
                        this.successState.style.transform = 'translateY(0)';
                        this.successState.style.opacity = '1';
                    }, 50);
                }, 300);
                
                // Save to history for resend functionality
                this.saveToHistory(email);
            }

            startCountdown() {
                this.countdownSeconds = 60;
                this.resendButton.disabled = true;
                
                this.countdownTimer = setInterval(() => {
                    this.countdownSeconds--;
                    this.countdownElement.textContent = this.countdownSeconds;
                    
                    if (this.countdownSeconds <= 0) {
                        clearInterval(this.countdownTimer);
                        this.resendButton.disabled = false;
                        document.getElementById('resendText').textContent = '重新發送';
                    }
                }, 1000);
            }

            async handleResend() {
                if (this.resendButton.disabled) return;
                
                try {
                    this.resendButton.disabled = true;
                    const originalText = document.getElementById('resendText').textContent;
                    document.getElementById('resendText').textContent = '正在發送...';
                    
                    await this.sendResetLink();
                    
                    // Show success feedback
                    document.getElementById('resendText').textContent = '✓ 已重新發送';
                    setTimeout(() => {
                        this.startCountdown();
                    }, 1000);
                    
                } catch (error) {
                    this.showGeneralError(error.message);
                    this.resendButton.disabled = false;
                    document.getElementById('resendText').textContent = '重新發送';
                }
            }

            setLoadingState(loading) {
                const buttonText = document.getElementById('sendButtonText');
                const buttonSpinner = document.getElementById('sendButtonSpinner');
                
                if (loading) {
                    buttonText.classList.add('hidden');
                    buttonSpinner.classList.remove('hidden');
                    this.sendButton.disabled = true;
                    this.loadingOverlay.classList.remove('hidden');
                } else {
                    buttonText.classList.remove('hidden');
                    buttonSpinner.classList.add('hidden');
                    this.sendButton.disabled = false;
                    this.loadingOverlay.classList.add('hidden');
                }
            }

            showGeneralError(message) {
                const errorText = document.getElementById('errorText');
                errorText.textContent = message;
                this.errorMessage.classList.remove('hidden');
                
                // Scroll to error message on mobile
                if (window.innerWidth < 768) {
                    this.errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            saveToHistory(email) {
                if (typeof(Storage) !== "undefined") {
                    localStorage.setItem('salesai_reset_email', email);
                    localStorage.setItem('salesai_reset_timestamp', Date.now().toString());
                }
            }

            loadFromHistory() {
                if (typeof(Storage) !== "undefined") {
                    const savedEmail = localStorage.getItem('salesai_reset_email');
                    const timestamp = localStorage.getItem('salesai_reset_timestamp');
                    
                    // If reset was requested in last 10 minutes, pre-fill email
                    if (savedEmail && timestamp) {
                        const tenMinutesAgo = Date.now() - (10 * 60 * 1000);
                        if (parseInt(timestamp) > tenMinutesAgo) {
                            this.emailInput.value = savedEmail;
                        }
                    }
                }
            }
        }

        // Initialize the forgot password page when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ForgotPasswordPage();
        });

        // Add keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // Close any error messages
                const errorMessage = document.getElementById('errorMessage');
                if (!errorMessage.classList.contains('hidden')) {
                    errorMessage.classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
