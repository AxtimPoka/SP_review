<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密碼 - SalesAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE', 
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'gray-dark': '#1A1A1A',
                        'gray-medium': '#666666',
                        'gray-light': '#999999',
                        'background-gray': '#F8F9FA',
                        'border-gray': '#E5E5E5'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .input-field:focus {
            border-color: #2E5BFF;
            box-shadow: 0 0 0 3px rgba(46, 91, 255, 0.1);
            outline: none;
        }
        
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .strength-weak { background: #FF4757; width: 25%; }
        .strength-fair { background: #FFB800; width: 50%; }
        .strength-good { background: #2E5BFF; width: 75%; }
        .strength-strong { background: #00D563; width: 100%; }
        
        .password-requirements {
            transition: all 0.3s ease;
        }
        
        .requirement-met {
            color: #00D563;
        }
        
        .requirement-unmet {
            color: #999999;
        }
        
        .eye-icon {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        
        .eye-icon:hover {
            color: #2E5BFF;
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="bg-background-gray min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center">
                <button onclick="goBack()" class="mr-4 p-2 -ml-2 rounded-lg hover:bg-gray-100 transition-colors">
                    <svg class="w-6 h-6 text-gray-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-xl font-semibold text-gray-dark">修改密碼</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 pb-safe">
        <!-- Security Info -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6 mt-4">
            <div class="flex items-start">
                <svg class="w-5 h-5 text-primary mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <div>
                    <h3 class="text-sm font-medium text-primary mb-1">安全提醒</h3>
                    <p class="text-sm text-gray-medium">為了保護您的帳戶安全，請設定強度較高的密碼，並定期更換。</p>
                </div>
            </div>
        </div>

        <!-- Password Change Form -->
        <div class="bg-white rounded-xl p-6">
            <form id="passwordForm" onsubmit="handleSubmit(event)">
                <!-- Current Password -->
                <div class="mb-6">
                    <label for="currentPassword" class="block text-sm font-medium text-gray-dark mb-2">
                        目前密碼 <span class="text-error">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="currentPassword" name="currentPassword" required
                               class="input-field w-full px-4 py-3 pr-12 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all"
                               placeholder="請輸入目前密碼">
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 eye-icon text-gray-light"
                                onclick="togglePassword('currentPassword')">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path id="currentPasswordEyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="currentPasswordError" class="hidden text-sm text-error mt-1">目前密碼錯誤</div>
                </div>

                <!-- New Password -->
                <div class="mb-6">
                    <label for="newPassword" class="block text-sm font-medium text-gray-dark mb-2">
                        新密碼 <span class="text-error">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="newPassword" name="newPassword" required
                               class="input-field w-full px-4 py-3 pr-12 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all"
                               placeholder="請輸入新密碼"
                               oninput="checkPasswordStrength(this.value)">
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 eye-icon text-gray-light"
                                onclick="togglePassword('newPassword')">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path id="newPasswordEyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Password Strength Indicator -->
                    <div class="mt-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-gray-medium">密碼強度</span>
                            <span id="strengthText" class="text-sm font-medium text-gray-light">請輸入密碼</span>
                        </div>
                        <div class="bg-gray-200 rounded-full h-1">
                            <div id="strengthBar" class="strength-bar bg-gray-200"></div>
                        </div>
                    </div>

                    <!-- Password Requirements -->
                    <div class="mt-4 space-y-2">
                        <p class="text-sm font-medium text-gray-medium">密碼要求：</p>
                        <div class="space-y-1">
                            <div id="req-length" class="requirement-unmet text-sm flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                至少 8 個字元
                            </div>
                            <div id="req-uppercase" class="requirement-unmet text-sm flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                包含大寫字母
                            </div>
                            <div id="req-lowercase" class="requirement-unmet text-sm flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                包含小寫字母
                            </div>
                            <div id="req-number" class="requirement-unmet text-sm flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                包含數字
                            </div>
                            <div id="req-special" class="requirement-unmet text-sm flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                </svg>
                                包含特殊字元 (!@#$%^&*)
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div class="mb-8">
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-dark mb-2">
                        確認新密碼 <span class="text-error">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                               class="input-field w-full px-4 py-3 pr-12 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all"
                               placeholder="請再次輸入新密碼"
                               oninput="checkPasswordMatch()">
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 eye-icon text-gray-light"
                                onclick="togglePassword('confirmPassword')">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path id="confirmPasswordEyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="confirmPasswordError" class="hidden text-sm text-error mt-1">兩次輸入的密碼不一致</div>
                    <div id="confirmPasswordSuccess" class="hidden text-sm text-success mt-1 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        密碼確認無誤
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitButton" disabled
                        class="w-full bg-primary text-white py-3 px-4 rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-600 transition-all">
                    <span id="submitText">更新密碼</span>
                    <svg id="submitSpinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Security Tips -->
        <div class="bg-white rounded-xl p-6 mt-4 mb-8">
            <h3 class="text-lg font-semibold text-gray-dark mb-4">密碼安全建議</h3>
            <div class="space-y-3">
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-success mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-sm text-gray-medium">使用大小寫字母、數字和特殊字元的組合</span>
                </div>
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-success mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-sm text-gray-medium">避免使用常見的密碼或個人資訊</span>
                </div>
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-success mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-sm text-gray-medium">每 3-6 個月更換一次密碼</span>
                </div>
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-success mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-sm text-gray-medium">不要在多個平台使用相同密碼</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let passwordStrength = 0;
        let requirements = {
            length: false,
            uppercase: false,
            lowercase: false,
            number: false,
            special: false
        };

        function goBack() {
            // 智能返回邏輯：根據用戶角色返回對應的首頁
            const userRole = localStorage.getItem('userRole');
            
            if (userRole === 'manager') {
                window.location.href = '../manager/MGR_001_dashboard.html';
            } else if (userRole === 'sales') {
                window.location.href = '../sales/SALES_001_home.html';
            } else {
                // 預設使用瀏覽器歷史記錄返回
                window.history.back();
            }
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(fieldId + 'EyeIcon');
            
            if (field.type === 'password') {
                field.type = 'text';
                eyeIcon.setAttribute('d', 'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21');
            } else {
                field.type = 'password';
                eyeIcon.setAttribute('d', 'M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z');
            }
        }

        function checkPasswordStrength(password) {
            // Reset requirements
            requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };

            // Update requirement indicators
            Object.keys(requirements).forEach(req => {
                const element = document.getElementById('req-' + req);
                if (requirements[req]) {
                    element.classList.remove('requirement-unmet');
                    element.classList.add('requirement-met');
                } else {
                    element.classList.remove('requirement-met');
                    element.classList.add('requirement-unmet');
                }
            });

            // Calculate strength score
            const metRequirements = Object.values(requirements).filter(Boolean).length;
            passwordStrength = metRequirements;

            // Update strength bar and text
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            strengthBar.className = 'strength-bar';
            
            if (password.length === 0) {
                strengthText.textContent = '請輸入密碼';
                strengthText.className = 'text-sm font-medium text-gray-light';
            } else if (metRequirements <= 2) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = '弱';
                strengthText.className = 'text-sm font-medium text-error';
            } else if (metRequirements <= 3) {
                strengthBar.classList.add('strength-fair');
                strengthText.textContent = '普通';
                strengthText.className = 'text-sm font-medium text-warning';
            } else if (metRequirements <= 4) {
                strengthBar.classList.add('strength-good');
                strengthText.textContent = '良好';
                strengthText.className = 'text-sm font-medium text-primary';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = '強';
                strengthText.className = 'text-sm font-medium text-success';
            }

            checkFormValidity();
            checkPasswordMatch();
        }

        function checkPasswordMatch() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('confirmPasswordError');
            const successDiv = document.getElementById('confirmPasswordSuccess');

            if (confirmPassword.length === 0) {
                errorDiv.classList.add('hidden');
                successDiv.classList.add('hidden');
                return;
            }

            if (newPassword === confirmPassword && newPassword.length > 0) {
                errorDiv.classList.add('hidden');
                successDiv.classList.remove('hidden');
            } else {
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }

            checkFormValidity();
        }

        function checkFormValidity() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitButton = document.getElementById('submitButton');

            const isValid = 
                currentPassword.length > 0 &&
                passwordStrength >= 4 &&
                newPassword === confirmPassword &&
                newPassword.length > 0;

            submitButton.disabled = !isValid;
        }

        function handleSubmit(event) {
            event.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const submitButton = document.getElementById('submitButton');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');

            // 模擬驗證目前密碼
            if (currentPassword !== 'oldpassword123') {
                const errorDiv = document.getElementById('currentPasswordError');
                errorDiv.classList.remove('hidden');
                
                const field = document.getElementById('currentPassword');
                field.classList.add('shake');
                field.focus();
                
                setTimeout(() => {
                    field.classList.remove('shake');
                }, 500);
                
                return;
            }

            // 開始載入狀態
            submitButton.disabled = true;
            submitText.textContent = '更新中...';
            submitSpinner.classList.remove('hidden');

            // 模擬 API 呼叫
            setTimeout(() => {
                submitSpinner.classList.add('hidden');
                submitText.textContent = '更新密碼';
                
                showToast('密碼已成功更新', 'success');
                
                // 2 秒後返回上一頁
                setTimeout(() => {
                    window.history.back();
                }, 2000);
            }, 2000);
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 px-4 py-3 rounded-lg text-white z-50 transition-all duration-300 ${
                type === 'success' ? 'bg-success' : 
                type === 'error' ? 'bg-error' : 'bg-primary'
            }`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 監聽輸入變化
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('currentPassword').addEventListener('input', function() {
                document.getElementById('currentPasswordError').classList.add('hidden');
                checkFormValidity();
            });
        });
    </script>
</body>
</html>
