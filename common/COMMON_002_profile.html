<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料 - SalesAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE', 
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'gray-dark': '#1A1A1A',
                        'gray-medium': '#666666',
                        'gray-light': '#999999',
                        'background-gray': '#F8F9FA',
                        'border-gray': '#E5E5E5'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .avatar-upload {
            position: relative;
            display: inline-block;
        }
        
        .avatar-upload input[type=file] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .avatar-preview {
            transition: all 0.3s ease;
        }
        
        .avatar-upload:hover .avatar-preview {
            opacity: 0.8;
        }
        
        .input-field:focus {
            border-color: #2E5BFF;
            box-shadow: 0 0 0 3px rgba(46, 91, 255, 0.1);
            outline: none;
        }
        
        .save-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .camera-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-background-gray min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center">
                <button onclick="goBack()" class="mr-4 p-2 -ml-2 rounded-lg hover:bg-gray-100 transition-colors">
                    <svg class="w-6 h-6 text-gray-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <h1 class="text-xl font-semibold text-gray-dark">個人資料</h1>
            </div>
            <button id="saveButton" onclick="saveProfile()" class="save-button px-4 py-2 bg-primary text-white rounded-lg font-medium hover:bg-blue-600 transition-colors disabled:hover:bg-primary">
                儲存
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 pb-safe">
        <!-- Avatar Section -->
        <div class="bg-white rounded-xl p-6 mb-4 mt-4">
            <div class="flex flex-col items-center">
                <div class="avatar-upload mb-4">
                    <div class="avatar-preview relative">
                        <img id="avatarImage" src="https://via.placeholder.com/120/2E5BFF/FFFFFF?text=王" 
                             alt="頭像" class="w-30 h-30 rounded-full object-cover border-4 border-gray-100">
                        <div class="camera-overlay">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
                </div>
                <p class="text-sm text-gray-medium text-center">點擊更換頭像</p>
                <p class="text-xs text-gray-light text-center mt-1">支援 JPG、PNG 格式，檔案大小不超過 5MB</p>
            </div>
        </div>

        <!-- Profile Form -->
        <div class="bg-white rounded-xl p-6 mb-4">
            <form id="profileForm" onsubmit="handleSubmit(event)">
                <!-- Basic Info -->
                <div class="space-y-6">
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-dark mb-2">
                            姓名 <span class="text-error">*</span>
                        </label>
                        <input type="text" id="fullName" name="fullName" value="王小明" required
                               class="input-field w-full px-4 py-3 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all">
                        <div id="fullNameError" class="hidden text-sm text-error mt-1">請輸入正確的姓名</div>
                    </div>

                    <div>
                        <label for="employeeId" class="block text-sm font-medium text-gray-dark mb-2">員工編號</label>
                        <input type="text" id="employeeId" name="employeeId" value="SA001" readonly
                               class="w-full px-4 py-3 border border-border-gray rounded-lg bg-gray-50 text-gray-medium cursor-not-allowed">
                        <p class="text-xs text-gray-light mt-1">員工編號無法修改</p>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-dark mb-2">
                            電子郵件 <span class="text-error">*</span>
                        </label>
                        <input type="email" id="email" name="email" value="wang.xiaoming@company.com" required
                               class="input-field w-full px-4 py-3 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all">
                        <div id="emailError" class="hidden text-sm text-error mt-1">請輸入正確的電子郵件地址</div>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-dark mb-2">手機號碼</label>
                        <input type="tel" id="phone" name="phone" value="0912-345-678"
                               class="input-field w-full px-4 py-3 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all">
                        <div id="phoneError" class="hidden text-sm text-error mt-1">請輸入正確的手機號碼</div>
                    </div>

                    <div>
                        <label for="department" class="block text-sm font-medium text-gray-dark mb-2">部門</label>
                        <select id="department" name="department" 
                                class="input-field w-full px-4 py-3 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all">
                            <option value="sales">銷售部</option>
                            <option value="marketing">行銷部</option>
                            <option value="management">管理部</option>
                            <option value="it">資訊部</option>
                        </select>
                    </div>

                    <div>
                        <label for="position" class="block text-sm font-medium text-gray-dark mb-2">職位</label>
                        <select id="position" name="position"
                                class="input-field w-full px-4 py-3 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all">
                            <option value="sales_rep">銷售專員</option>
                            <option value="senior_sales">資深銷售</option>
                            <option value="sales_manager">銷售主管</option>
                            <option value="sales_director">銷售總監</option>
                        </select>
                    </div>

                    <div>
                        <label for="joinDate" class="block text-sm font-medium text-gray-dark mb-2">到職日期</label>
                        <input type="date" id="joinDate" name="joinDate" value="2023-03-15"
                               class="input-field w-full px-4 py-3 border border-border-gray rounded-lg focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>
                </div>
            </form>
        </div>

        <!-- Account Info -->
        <div class="bg-white rounded-xl p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-dark mb-4">帳戶資訊</h3>
            <div class="space-y-4">
                <div class="flex justify-between items-center py-2">
                    <span class="text-gray-medium">最後登入時間</span>
                    <span class="text-gray-dark">2024-08-14 09:30</span>
                </div>
                <div class="flex justify-between items-center py-2">
                    <span class="text-gray-medium">帳戶建立時間</span>
                    <span class="text-gray-dark">2023-03-15</span>
                </div>
                <div class="flex justify-between items-center py-2">
                    <span class="text-gray-medium">帳戶狀態</span>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                        正常
                    </span>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm mx-4">
            <div class="flex items-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-gray-dark">正在儲存...</span>
            </div>
        </div>
    </div>

    <script>
        let hasChanges = false;

        function goBack() {
            if (hasChanges) {
                if (confirm('您有未儲存的變更，確定要離開嗎？')) {
                    // 智能返回邏輯：根據用戶角色返回對應的首頁
                    const userRole = localStorage.getItem('userRole');
                    
                    if (userRole === 'manager') {
                        window.location.href = '../manager/MGR_001_dashboard.html';
                    } else if (userRole === 'sales') {
                        window.location.href = '../sales/SALES_001_home.html';
                    } else {
                        // 預設使用瀏覽器歷史記錄返回
                        window.history.back();
                    }
                }
            } else {
                // 智能返回邏輯：根據用戶角色返回對應的首頁
                const userRole = localStorage.getItem('userRole');
                
                if (userRole === 'manager') {
                    window.location.href = '../manager/MGR_001_dashboard.html';
                } else if (userRole === 'sales') {
                    window.location.href = '../sales/SALES_001_home.html';
                } else {
                    // 預設使用瀏覽器歷史記錄返回
                    window.history.back();
                }
            }
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            const avatarImage = document.getElementById('avatarImage');
            
            if (file) {
                // 檢查檔案大小 (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    showToast('檔案大小不能超過 5MB', 'error');
                    return;
                }
                
                // 檢查檔案類型
                if (!file.type.match(/^image\/(jpeg|jpg|png)$/)) {
                    showToast('僅支援 JPG、PNG 格式', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarImage.src = e.target.result;
                    markAsChanged();
                };
                reader.readAsDataURL(file);
            }
        }

        function markAsChanged() {
            hasChanges = true;
            const saveButton = document.getElementById('saveButton');
            saveButton.disabled = false;
            saveButton.classList.remove('opacity-60');
        }

        function validateForm() {
            let isValid = true;
            
            // 驗證姓名
            const fullName = document.getElementById('fullName').value.trim();
            const fullNameError = document.getElementById('fullNameError');
            if (!fullName || fullName.length < 2) {
                fullNameError.classList.remove('hidden');
                isValid = false;
            } else {
                fullNameError.classList.add('hidden');
            }
            
            // 驗證電子郵件
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                emailError.classList.remove('hidden');
                isValid = false;
            } else {
                emailError.classList.add('hidden');
            }
            
            // 驗證手機號碼
            const phone = document.getElementById('phone').value.trim();
            const phoneError = document.getElementById('phoneError');
            const phoneRegex = /^09\d{2}-?\d{3}-?\d{3}$/;
            if (phone && !phoneRegex.test(phone.replace(/-/g, ''))) {
                phoneError.classList.remove('hidden');
                isValid = false;
            } else {
                phoneError.classList.add('hidden');
            }
            
            return isValid;
        }

        function saveProfile() {
            if (!validateForm()) {
                showToast('請檢查表單內容', 'error');
                return;
            }
            
            showLoading(true);
            
            // 模擬 API 呼叫
            setTimeout(() => {
                showLoading(false);
                hasChanges = false;
                
                const saveButton = document.getElementById('saveButton');
                saveButton.disabled = true;
                saveButton.classList.add('opacity-60');
                
                showToast('個人資料已更新', 'success');
            }, 2000);
        }

        function handleSubmit(event) {
            event.preventDefault();
            saveProfile();
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 px-4 py-3 rounded-lg text-white z-50 transition-all duration-300 ${
                type === 'success' ? 'bg-success' : 
                type === 'error' ? 'bg-error' : 'bg-primary'
            }`;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 監聽表單變更
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('profileForm');
            const inputs = form.querySelectorAll('input:not([readonly]), select');
            
            inputs.forEach(input => {
                input.addEventListener('input', markAsChanged);
                input.addEventListener('change', markAsChanged);
            });
            
            // 初始狀態設定儲存按鈕為停用
            const saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.classList.add('opacity-60');
        });

        // 防止意外離開
        window.addEventListener('beforeunload', function(e) {
            if (hasChanges) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
