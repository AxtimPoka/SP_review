<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定 - SalesAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2E5BFF',
                        secondary: '#00C6AE', 
                        success: '#00D563',
                        warning: '#FFB800',
                        error: '#FF4757',
                        'gray-dark': '#1A1A1A',
                        'gray-medium': '#666666',
                        'gray-light': '#999999',
                        'background-gray': '#F8F9FA',
                        'border-gray': '#E5E5E5'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .setting-item:active {
            transform: scale(0.98);
            transition: transform 0.1s ease-in-out;
        }
        
        .icon-container {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-background-gray min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center">
            <button onclick="goBack()" class="mr-4 p-2 -ml-2 rounded-lg hover:bg-gray-100 transition-colors">
                <svg class="w-6 h-6 text-gray-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <h1 class="text-xl font-semibold text-gray-dark">設定</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 pb-safe">
        <!-- Profile Section -->
        <div class="bg-white rounded-xl p-4 mb-4 mt-4">
            <div class="flex items-center">
                <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mr-4">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 7.5V9C15 10.1 15.9 11 17 11S19 10.1 19 11V9H21ZM1 9V11C1 10.1 1.9 11 3 11S5 10.1 5 9V7.5L-1 7V9ZM12 7C8.13 7 5 8.57 5 12.5V17C5 18.1 5.9 19 7 19H17C18.1 19 19 18.1 19 17V12.5C19 8.57 15.87 7 12 7Z"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="text-lg font-semibold text-gray-dark">王小明</h2>
                    <p class="text-sm text-gray-medium">銷售專員</p>
                    <p class="text-xs text-gray-light">ID: SA001</p>
                </div>
                <button onclick="editProfile()" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
                    <svg class="w-5 h-5 text-gray-medium" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Settings Options -->
        <div class="space-y-4">
            <!-- Account Section -->
            <div class="bg-white rounded-xl overflow-hidden">
                <div class="px-4 py-3 border-b border-border-gray">
                    <h3 class="text-sm font-medium text-gray-medium">帳戶設定</h3>
                </div>
                
                <div class="divide-y divide-border-gray">
                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_002_profile.html')">
                        <div class="icon-container bg-blue-100 mr-3">
                            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">個人資料</h4>
                            <p class="text-sm text-gray-light">編輯姓名、頭像等基本資訊</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-light ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>

                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_003_change_password.html')">
                        <div class="icon-container bg-green-100 mr-3">
                            <svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">修改密碼</h4>
                            <p class="text-sm text-gray-light">變更登入密碼</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-light ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Notifications & Privacy Section -->
            <div class="bg-white rounded-xl overflow-hidden">
                <div class="px-4 py-3 border-b border-border-gray">
                    <h3 class="text-sm font-medium text-gray-medium">通知與隱私</h3>
                </div>
                
                <div class="divide-y divide-border-gray">
                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_004_notification_settings.html')">
                        <div class="icon-container bg-yellow-100 mr-3">
                            <svg class="w-5 h-5 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.5 3.5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6-6-6"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">通知設定</h4>
                            <p class="text-sm text-gray-light">管理推播通知偏好</p>
                        </div>
                        <div class="flex items-center">
                            <span class="text-xs bg-primary text-white px-2 py-1 rounded-full mr-2">3 項開啟</span>
                            <svg class="w-5 h-5 text-gray-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>

                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_005_privacy_settings.html')">
                        <div class="icon-container bg-red-100 mr-3">
                            <svg class="w-5 h-5 text-error" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">隱私設定</h4>
                            <p class="text-sm text-gray-light">資料隱私和權限管理</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-light ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Support Section -->
            <div class="bg-white rounded-xl overflow-hidden">
                <div class="px-4 py-3 border-b border-border-gray">
                    <h3 class="text-sm font-medium text-gray-medium">支援與協助</h3>
                </div>
                
                <div class="divide-y divide-border-gray">
                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_006_help_support.html')">
                        <div class="icon-container bg-purple-100 mr-3">
                            <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">幫助與支援</h4>
                            <p class="text-sm text-gray-light">常見問題、聯絡客服</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-light ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>

                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_007_about.html')">
                        <div class="icon-container bg-gray-100 mr-3">
                            <svg class="w-5 h-5 text-gray-medium" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">關於我們</h4>
                            <p class="text-sm text-gray-light">版本資訊、公司介紹</p>
                        </div>
                        <div class="flex items-center">
                            <span class="text-xs text-gray-light mr-2">v2.1.0</span>
                            <svg class="w-5 h-5 text-gray-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="bg-white rounded-xl overflow-hidden">
                <div class="px-4 py-3 border-b border-border-gray">
                    <h3 class="text-sm font-medium text-gray-medium">快速功能</h3>
                </div>
                
                <div class="divide-y divide-border-gray">
                    <div class="setting-item px-4 py-4 flex items-center cursor-pointer hover:bg-gray-50 transition-colors" onclick="navigateTo('./COMMON_008_notification_center.html')">
                        <div class="icon-container bg-blue-100 mr-3">
                            <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19H6.5A2.5 2.5 0 014 16.5v-9A2.5 2.5 0 016.5 5h11A2.5 2.5 0 0120 7.5v3.5"></path>
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-base font-medium text-gray-dark">通知中心</h4>
                            <p class="text-sm text-gray-light">查看所有系統通知</p>
                        </div>
                        <div class="flex items-center">
                            <span class="text-xs bg-error text-white px-2 py-1 rounded-full mr-2">5</span>
                            <svg class="w-5 h-5 text-gray-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Logout Section -->
            <div class="bg-white rounded-xl mt-6 mb-8">
                <button onclick="logout()" class="w-full px-4 py-4 text-center text-error font-medium hover:bg-red-50 transition-colors rounded-xl">
                    登出
                </button>
            </div>
        </div>
    </main>

    <script>
        function goBack() {
            // 智能返回邏輯：根據用戶角色返回對應的首頁
            const userRole = localStorage.getItem('userRole');
            
            if (userRole === 'manager') {
                window.location.href = '../manager/MGR_001_dashboard.html';
            } else if (userRole === 'sales') {
                window.location.href = '../sales/SALES_001_home.html';
            } else {
                // 預設使用瀏覽器歷史記錄返回
                window.history.back();
            }
        }

        function navigateTo(url) {
            window.location.href = url;
        }

        function editProfile() {
            navigateTo('./COMMON_002_profile.html');
        }

        function logout() {
            if (confirm('確定要登出嗎？')) {
                // 清除本地儲存的登入資料
                localStorage.removeItem('userToken');
                localStorage.removeItem('userInfo');
                
                // 導向登入頁面
                window.location.href = '../login.html';
            }
        }

        // 添加觸控回饋效果
        document.querySelectorAll('.setting-item').forEach(item => {
            item.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.98)';
            });
            
            item.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
